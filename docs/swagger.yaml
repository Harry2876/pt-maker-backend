openapi: 3.0.0

info:
  title: BGMI Tournament Platform API
  version: 2.0.0
  description: |
    ## BGMI Tournament Platform — Internal API Documentation

    > **Restricted.** Internal team access only. Do not share this URL.

    Full-stack tournament management system for BGMI (Battlegrounds Mobile India).
    Handles everything from player onboarding to live match results and AI-powered standings image generation.
    Production: **https://scrymzengineservice.site**

    ---

    ## Quick PT — Complete Developer Integration Guide

    Quick PT is the core feature of v2. It turns raw BGMI scoreboard screenshots into a
    professional standings image in under 30 seconds, powered by a Python AI backend.

    ### Architecture

    ```
    Mobile/Web App
        │
        ▼
    Node.js API (this server)         Python AI Service (private network)
    ─────────────────────────         ────────────────────────────────────
    Auth, DB, Redis, R2               YOLO OCR, Image generation
    Orchestrates flow                 Reads/writes Cloudflare R2 directly
    Signs R2 URLs for clients         Returns raw R2 URLs
    ```

    The Node.js server never processes images itself — it orchestrates the Python AI and
    signs the R2 URLs so clients can display them.

    ---

    ### End-to-End Flow (Quick PT)

    #### Step 1 — Authenticate
    ```
    POST /auth/send-otp      { phoneNumber: "+91XXXXXXXXXX" }
    POST /auth/verify-otp    { phoneNumber, otp }
    → accessToken (30 min), refreshToken (34 days)
    ```

    #### Step 2 — Create a Quick Match
    ```
    POST /quick-pt/matches
    {
      "matchName": "BGMI Scrims Day 1",
      "game": "BGMI",
      "positionPointsConfig": [15,12,10,8,6,4,2,1,1,1,1,0,0,0,0,0],
      "killPointsValue": 1
    }
    → { id: "<matchId>" }
    ```

    #### Step 3 — Set Slot Assignments (optional)
    If you know which team occupies which slot before the match, parse them now.
    This gives cleaner team names in the final standings.
    ```
    POST /quick-pt/matches/{id}/slots/parse
    {
      "text": "Slot 01 -> Team Alpha\nSlot 02 -> Team Beta\n..."
    }
    ```
    Skip this step if you want the AI to auto-detect team identities from screenshots.

    #### Step 4 — Upload Screenshots
    Upload attendance screenshots (taken before match starts) and result screenshots
    (taken after match ends) as multipart/form-data.
    ```
    POST /quick-pt/matches/{id}/screenshots?type=ATTENDANCE
    Content-Type: multipart/form-data
    screenshots: <file1>, <file2>, ...   (up to 3 attendance images)

    POST /quick-pt/matches/{id}/screenshots?type=RESULT
    screenshots: <file1>, ..., <file9>   (up to 9 result images)
    ```

    #### Step 5 — Process Attendance
    Sends uploaded attendance screenshots to Python AI. Detects slot numbers and
    player rosters. Creates slot records in the DB with player names.
    ```
    POST /quick-pt/matches/{id}/process
    { "type": "ATTENDANCE" }
    → { slotsDetected: 16, slotsCreated: 16 }
    ```

    #### Step 6 — Process Results
    Sends result screenshots to Python AI (per-image OCR). Extracts final rankings and
    **per-player kill counts**. Teams are matched to slots using fuzzy roster matching.
    Points are calculated and written to DB.
    ```
    POST /quick-pt/matches/{id}/process
    { "type": "RESULT" }
    → {
        resultsCreated: 16,
        audit: { saved: [{ slotNumber, rank, totalKills, playerResults: [{ playerName, kills }] }] },
        results: [{ slotNumber, rank, totalKills, playerResults, totalPoints, ... }],
        warnings: [...]
      }
    ```

    > **Note:** `playerResults` is only populated for **AI-processed** results.
    > Manual entry results (`MANUAL_ENTRY` status) will have `playerResults: null`.
    > Check `result.status` to determine whether per-player data is available.

    > **Tip:** Run both steps at once with `{ "type": "COMPLETE" }`.

    #### Step 6b — Manual Result Entry (alternative to AI processing)
    Use these endpoints when skipping AI processing (no screenshots).
    All IDs (match, result) are UUID v4 strings.

    **Single entry:**
    ```
    POST /quick-pt/matches/{id}/results/manual
    {
      "slotNumber": 1,          // integer 1–25 (required)
      "teamName": "Team Alpha", // string 2–50 chars (required)
      "position": 1,            // integer 1–25 (required)
      "totalKills": 12,         // integer 0–99 (required)
      "rank": 1,                // integer 1–25 (optional, defaults to position)
      "entryNotes": "Verified"  // string ≤500 chars (optional)
    }
    → 201: { success, message, data: MatchResultItem, meta }
    ```

    **Bulk create (up to 25 teams at once):**
    ```
    POST /quick-pt/matches/{id}/results/bulk
    {
      "results": [
        { "slotNumber": 1, "teamName": "Team Alpha", "position": 1, "totalKills": 12 },
        { "slotNumber": 2, "teamName": "Team Beta",  "position": 2, "totalKills": 8  }
      ],
      "replaceExisting": true   // deletes existing MANUAL_ENTRY results first (AI results preserved)
    }
    → 201 (all ok) or 207 (partial) — body is BulkOperationResponse
    ```

    **Bulk update (up to 25 at once):**
    ```
    PUT /quick-pt/matches/{id}/results/bulk
    {
      "updates": [
        {
          "resultId": "<uuid>",
          "data": { "position": 2, "totalKills": 10 }   // only changed fields
        }
      ]
    }
    → 200 (all ok) or 207 (partial) — body is BulkOperationResponse
    ```

    **Single update:**
    ```
    PUT /quick-pt/matches/{quickMatchId}/results/{resultId}
    { "position": 3, "totalKills": 10 }   // any subset of fields
    → 200: { success, message, data: MatchResultItem, meta }
    ```

    **Delete single:**
    ```
    DELETE /quick-pt/matches/{quickMatchId}/results/{resultId}
    → 200: { success, message }
    ```

    **Bulk delete:**
    ```
    DELETE /quick-pt/matches/{id}/results/bulk
    { "resultIds": ["<uuid>", "<uuid>"] }
    → 200: BulkOperationResponse
    ```

    > **App note:** `playerResults` is always `null` for manual results.
    > Only check `slotNumber`, `teamName`, `position`, `rank`, `totalKills`,
    > `positionPoints`, `killPoints`, `totalPoints` for manual entries.

    #### Step 7 — View Results
    ```
    GET /quick-pt/matches/{id}/results
    → { results: [...], count }
    ```
    Each item's `status` field indicates origin: `MANUAL_ENTRY` or `PROCESSED`.
    `playerResults` is populated only for `PROCESSED` results.

    #### Step 8 — Export Standings Image
    Choose a template, then generate the standings PNG.
    ```
    GET /quick-pt/templates
    → { "16_teams": [{ name: "tmplate_1", signedUrl: "...", ... }] }

    POST /quick-pt/matches/{id}/export
    {
      "template": "tmplate_2",          ← template name from step above
      "formatType": "16_teams",          ← category key
      "tableFontSize": 75,
      "tableHeaderLabelMode": "abbr",
      "elementOverrides": {
        "event_name":     { "size": 85, "color": "#FFFFFF" },
        "sponsor_name":   { "size": 55, "color": "#FFD700" }
      },
      "columnOverrides": {
        "total":          { "color": "#FFD700", "weight": "bold" },
        "kills":          { "color": "#FF6B6B" }
      }
    }
    → { signedImageUrl: "https://...r2.dev/standings/...png?X-Amz-..." }
    ```
    The `signedImageUrl` is valid for **30 minutes**. Re-call `/export` to get a fresh URL.

    ---

    ### Quick Series Flow

    A series groups multiple Quick Matches and shows an **aggregated leaderboard**.
    Scoring is configured **per match** — there is no series-level points config.

    #### Step 1 — Create Series
    ```
    POST /quick-pt/series
    { "seriesName": "BGMI League Week 1", "game": "BGMI", "totalMatches": 6 }
    → { id: "<seriesId>" }
    ```

    #### Step 2 — Create & Process Matches
    For each leg, run the normal Quick PT flow (`POST /matches` with scoring config,
    upload screenshots, process, get results). Set `positionPointsConfig` / `killPointsValue`
    on each match as needed.

    #### Step 3 — Link Matches to Series
    ```
    POST /quick-pt/series/{seriesId}/matches
    { "quickMatchId": "<matchId>" }
    ```
    All matches must share the same slot/team roster. Leaderboard rebuilds when results change.

    #### Step 4 — View Leaderboard
    ```
    GET /quick-pt/series/{seriesId}/leaderboard
    → { leaderboardData: [...] }   // null if no results yet
    ```

    #### Step 5 — Export (optional)
    ```
    POST /quick-pt/series/{seriesId}/export          → standings PNG
    GET  /quick-pt/series/{seriesId}/export/excel    → single-sheet Excel
    ```

    #### Tie-breaking (optional)
    ```
    POST /quick-pt/series/{seriesId}/conflicts/detect
    POST /quick-pt/series/{seriesId}/conflicts/resolve   // team names, not UUIDs
    POST /quick-pt/series/{seriesId}/tie-breaking/rules
    ```

    ---

    ### Key Design Decisions

    | Concern | Decision |
    |---|---|
    | **Python AI access to R2** | Python reads/writes R2 directly using its own credentials. Node.js never proxies image bytes. |
    | **Signed URLs** | All R2 URLs returned to clients are pre-signed (30 min TTL). Never expose raw R2 URLs to clients. |
    | **Slot matching** | Results matched to attendance slots by fuzzy player-name comparison: exact → prefix/substring → proportional Levenshtein (≤ 2/3/4 by name length) → bigram similarity ≥ 70 %. One matching player is sufficient. |
    | **Re-export** | Calling `/export` again overwrites the previous standings record (`upsert`). |
    | **Series scoring** | No series-level points config. Each match's scoring is used; series sums match totals. |
    | **Token lifecycle** | Access token = 30 min. Refresh token = 34 days. Use `POST /auth/refresh-token` to get a new pair silently. |

    ---

    ### Authentication
    All protected endpoints require a JWT Bearer token:
    ```
    Authorization: Bearer <access_token>
    ```
    Access tokens expire in **30 minutes** — refresh using `POST /auth/refresh-token`.

    ### Standard Response Envelope
    ```json
    {
      "success": true,
      "message": "Human readable description",
      "data": { },
      "error": { "code": "ERROR_CODE", "details": "More info" },
      "meta": { "timestamp": "2024-01-15T10:30:00.000Z", "version": "1.0" }
    }
    ```

    ### Error Codes
    | Code | Meaning |
    |---|---|
    | `VALIDATION_ERROR` | Request body or params failed validation |
    | `UNAUTHORIZED` | Missing or invalid JWT token |
    | `NOT_FOUND` | Resource does not exist |
    | `CONFLICT` | Duplicate resource |
    | `RATE_LIMIT` | Too many requests |
    | `INTERNAL_ERROR` | Unexpected server error |

    ### Modules
    | Module | Base Path | Description |
    |---|---|---|
    | Auth | `/auth` | OTP login, registration, token management, sessions |
    | Quick PT | `/quick-pt` | AI-powered quick point table generation (primary feature) |
    | Tournaments | `/tournaments` | Create and manage BGMI tournaments |
    | Tournament Stages | `/tournament-stages` | Multi-stage tournament structure |
    | Matches | `/matches` | Match scheduling and management |
    | Match Results | `/match-results` | Submit and query match results |
    | Teams | `/teams` | Team enrollment and management |
    | Team Registration | `/team-registrations` | Register teams to tournaments |
    | Groups | `/groups` | Tournament group/pool management (stage-linked) |
    | Slot Management | `/slot-management` | Group slot assignment (1–25) |
    | Team Advancement | `/team-advancement` | Qualify, progress, and advance stages |
    | Scoring Rules | `/scoring-rules` | Tournament kill/placement scoring configuration |
    | Collaborators | `/collaborators` | Tournament staff / co-host invites, roles, permissions |
    | Leaderboards | `/leaderboards` | Rankings and standings |
    | Uploads | `/uploads` | Tournament match screenshot **storage only** (not Quick PT — see below) |
    | Players | `/players` | Player roster management |

    ### Screenshot uploads — Tournament vs Quick PT

    Two separate upload systems share the same multer middleware but **do not share data**:

    - **Quick PT (production):** `POST /quick-pt/matches/{id}/screenshots?type=ATTENDANCE|RESULT`
      → OCR, slot detection, result extraction, standings graphics. Use this for the Quick PT app.

    - **Tournament (core flow):** `POST /uploads/matches/{id}/screenshots/upload?type=ATTENDANCE_IMAGE|RESULT_IMAGE`
      → Stores files on R2 under `tournaments/` and links to the tournament `Match` record only.
      **No AI/OCR.** Results must be entered via `/match-results` (manual entry → verify → publish).

    **Important:** `{id}` is a different entity in each system. Never pass a Quick Match ID to `/uploads/...`
    or a tournament Match UUID to `/quick-pt/...` — validation will fail or behave unexpectedly.

    Both paths share a per-user upload lock; concurrent uploads across both systems return 429.

    ---

    ## Tournament Manager — Integration Guide

    ### Stage ↔ Group linking

    | When | Endpoint | Where is stageId? |
    |---|---|---|
    | Initial setup (one group) | `POST /groups/tournaments/{tournamentId}/groups/create` | Optional in **request body** |
    | Next stage (bulk) | `POST /team-advancement/stage/{stageId}/groups` | **URL path** |
    | List groups on a stage | `GET /team-advancement/stage/{stageId}/groups` | URL path |

    Group create response always includes `data.stageId` — that confirms the link.

    **`PUT /groups/update/{id}`** — exists; use for name / maxTeams / qualificationSpots. No `stageId`.

    **`totalStages` / `tournamentFormat`** — set on `POST /tournaments/create` only. `PUT /tournaments/update/{id}` accepts name, game, status only.

    ### Setup flow

    ```
    1. POST /tournaments/create          (totalStages, tournamentFormat optional)
    2. POST /tournament-stages/.../stages
    3. POST /groups/.../groups/create  (stageId in body, or omit)
    4. teams → slots → matches → results → leaderboard
    ```

    Full schemas: `docs/paths/tournaments.yaml`

