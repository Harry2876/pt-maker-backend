paths:

  # ══════════════════════════════════════════════════════════════════════
  # FONTS
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/fonts:
    get:
      tags: [Quick-PT Graphics]
      summary: List all bundled fonts
      description: |
        Returns every font bundled in the Python AI service.
        Use the `id` or `filename` as the value of `font_file` inside any
        `fontCustomization` object when calling any graphics generation endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Font list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      fonts:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, example: "akira_expanded" }
                            filename: { type: string, example: "akira_expanded.otf" }
                            display_name: { type: string, example: "Akira Expanded" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ══════════════════════════════════════════════════════════════════════
  # MEDIA PROXY & EXPORT HISTORY
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/media/{assetId}:
    get:
      tags: [Quick-PT Graphics]
      summary: Stream a generated PNG by asset ID (legacy)
      description: |
        **Legacy endpoint** — prefer signed `previewUrl` from generate/export responses
        (`GET /quick-pt/files/{fileId}?exp=&sig=`).

        Requires **Authorization: Bearer** or `?access_token=` query param.
        Node streams the file from R2 — clients never see bucket names or presigned R2 URLs.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
          example: "cmqqnxb6t00038za1l2k7jnzo"
        - in: query
          name: access_token
          schema:
            type: string
          description: JWT access token (alternative to Authorization header)
      responses:
        "200":
          description: PNG image stream
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /quick-pt/matches/{id}/media:
    get:
      tags: [Quick-PT Graphics]
      summary: List export media history for a match
      description: |
        Returns all stored media assets for a match (standings, slot-list, roster, top-10),
        **newest first**. Each item includes `assetId` + `previewUrl`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [STANDINGS, SLOT_LIST, ROSTER, TOP_10]
          description: Filter by asset type
          example: "ROSTER"
      responses:
        "200":
          description: Media history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match media history retrieved"
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 3
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaAssetListItem"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ══════════════════════════════════════════════════════════════════════
  # MATCH-SPECIFIC SLOT LOGOS
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/slots/{slotNumber}/logo:
    post:
      tags: [Quick-PT Graphics]
      summary: Upload a match-specific team logo for a slot
      description: |
        Uploads a logo image for a specific slot in a match.
        Stored in R2 under `match-logos/{matchId}/slot-{slotNumber}-{uuid}.{ext}`.

        This logo **overrides** any preset logo during standings export and all
        graphics generation (slot-list, roster, top-10).

        **Logo resolution order:** match logo → preset entry logo → no logo (Python placeholder)

        Allowed formats: JPEG, PNG, WebP — max **5 MB**.

        ### Typical workflow
        1. Optional: assign a preset entry — `POST .../slots/{slotId}/preset`
        2. Or upload a match-specific logo here (takes priority over preset)
        3. Generate any graphic — logos are pulled from DB automatically; do not pass logo URLs in the generate body
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: path
          name: slotNumber
          required: true
          schema:
            type: integer
          description: Slot number (1-based)
          example: 3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: Team logo image (JPEG/PNG/WebP, max 5 MB)
      responses:
        "200":
          description: Logo uploaded and attached to slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Match logo attached successfully" }
                  data:
                    type: object
                    properties:
                      logoStorageUrl:
                        type: string
                        description: Raw R2/CDN URL of the uploaded logo (used by Python during generation)
                        example: "https://pub-xxx.r2.dev/match-logos/clx123/slot-3-abc.png"
                      fileId:
                        type: string
                        example: "cmqqnxb6t00038za1l2k7jnzo"
                      previewUrl:
                        type: string
                        format: uri
                        description: |
                          Signed preview URL for immediate display.
                          Pattern: `/api/v1/quick-pt/files/{fileId}?exp=&sig=`
                        example: "https://scrymzengineservice.site/api/v1/quick-pt/files/cmqqnxb6t00038za1l2k7jnzo?exp=1782757174&sig=d7510091..."
                      signedUrl:
                        type: string
                        format: uri
                        description: Same as previewUrl (Android fallback)
                      signedLogoUrl:
                        type: string
                        format: uri
                        description: Deprecated alias of previewUrl
                      expiresAt:
                        type: string
                        format: date-time
                      previewUrlExpiresInSeconds:
                        type: integer
                        example: 1800
        "400":
          description: No file uploaded or invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Quick-PT Graphics]
      summary: Remove the match-specific logo from a slot
      description: |
        Deletes the match-specific logo from R2 and clears the reference on the slot.
        The preset entry logo (if any) will be used instead during generation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: path
          name: slotNumber
          required: true
          schema:
            type: integer
          description: Slot number (1-based)
      responses:
        "200":
          description: Match logo removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Match logo removed successfully" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ══════════════════════════════════════════════════════════════════════
  # PRESET LOGO ASSIGNMENT TO SLOT
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/slots/{slotId}/preset:
    post:
      tags: [Quick-PT Graphics]
      summary: Assign a preset entry logo to a slot
      description: |
        Links a `TeamLogoPresetEntry` (from a user-owned preset) to a match slot.
        The entry's logo is used for all graphics unless a match-specific logo also exists.

        Preset CRUD: `POST/GET /quick-pt/logo-presets` and
        `POST /quick-pt/logo-presets/{presetId}/entries`.

        Get entry IDs from `GET /quick-pt/logo-presets/{presetId}` or
        `POST /quick-pt/logo-presets/suggest`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: path
          name: slotId
          required: true
          schema:
            type: string
          description: Slot Assignment ID (not slot number — from GET /quick-pt/matches/{id}/slots)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presetEntryId]
              properties:
                presetEntryId:
                  type: string
                  description: ID of the TeamLogoPresetEntry to assign
                  example: "entry_clx789def"
      responses:
        "200":
          description: Preset entry assigned to slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Preset entry assigned to slot successfully" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Quick-PT Graphics]
      summary: Remove the preset entry assignment from a slot
      description: |
        Unlinks the preset entry from the slot. Match-specific logo (if any) is unaffected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: path
          name: slotId
          required: true
          schema:
            type: string
          description: Slot Assignment ID
      responses:
        "200":
          description: Preset entry removed from slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Preset entry removed from slot successfully" }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ══════════════════════════════════════════════════════════════════════
  # SLOT LIST GRAPHIC
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/graphics/slot-list:
    post:
      tags: [Quick-PT Graphics]
      summary: Generate slot-list graphic for a match
      description: |
        Generates a slot-list PNG showing all team slots, names, and logos for a match.

        **Same pattern as standings export** (`POST /quick-pt/matches/{id}/export`):
        - Match ID is in the **path** (`id`), not the request body.
        - Pass `template` + `formatType` from `GET /quick-pt/templates`.
        -         Node resolves template image + config URLs, loads
          `slot_data` from DB, and forwards a snake_case payload to Python AI.
        Python fetches template/config/logo URLs with its own R2 credentials
        (same as calling Python directly with raw cloudflarestorage.com URLs).

        ### How it works internally
        1. Node loads slot assignments for the match (ordered by slot number).
        2. Only slots **1–24** are included (Python API limit).
        3. Team logos: match logo → preset entry logo → none (raw R2 URLs — Python fetches with its own credentials).
        4. Node calls Python `POST /api/v1/slot-list/generate`.
        5. Node registers the PNG as a media asset and returns `assetId` + `previewUrl`.

        **Preview:** load `data.previewUrl` directly (signed `/quick-pt/files/{fileId}?exp=&sig=` URL).
        **History:** `GET /quick-pt/matches/{id}/media`.

        ### Prerequisites
        - Match must have slot assignments (`POST /quick-pt/matches/{id}/slots`).
        - Optional team logos: upload per slot (`POST .../slots/{slotNumber}/logo`) or assign a preset entry (`POST .../slots/{slotId}/preset`).

        ### Tuning tips
        | Problem | Fix |
        |---------|-----|
        | Everything too high | `gridOverrides.row_offset_y: 6` |
        | Only team names too high | `gridOverrides.team_name.offset_y: 5` |
        | Bigger text | `teamNameFontSize: 28` |
        | Darker team names | `teamNameColor: "#000000"` |
        | More logo gap | `teamLogoGap: 18` |

        Use snake_case keys inside `headerOverrides`, `gridOverrides`, and `fontCustomization`
        (same keys Python expects). Top-level styling fields use camelCase in the Node API body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotListGraphicRequest"
            example:
              template: "sl1"
              formatType: "slot_list"
              headerOverrides:
                extra_text_info: "BGMI SCRIMS"
                information: "Group A — Day 1"
              slotNumberFontSize: 26
              teamNameFontSize: 24
              slotNumberColor: "#1A1A1A"
              teamNameColor: "#003366"
              teamLogoGap: 14
              teamLogoSize: 52
              gridOverrides:
                row_offset_y: 5
                team_name:
                  offset_y: 3
                  font_size: 24
                  color: "#003366"
                slot_number:
                  font_size: 26
                  color: "#1A1A1A"
              fontCustomization:
                header_font: { font_file: "built_titling_bd.ttf" }
                slot_number_font: { font_file: "agency_bold.ttf", color: "#1A1A1A" }
                team_name_font: { font_file: "roboto_condensed_black.ttf", color: "#003366" }
                footer_font: { font_file: "coolvetica_rg.ttf" }
                branding_font: { font_file: "coolvetica_rg.ttf", color: "#888888" }
                global_size_multiplier: 1.0
              outputFilename: "slot_list_match1.png"
      responses:
        "200":
          description: Slot-list graphic generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotListGraphicResponse"
        "400":
          description: Validation error or no slots found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ══════════════════════════════════════════════════════════════════════
  # TEAM ROSTER GRAPHIC
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/graphics/roster:
    post:
      tags: [Quick-PT Graphics]
      summary: Generate team roster graphic for a match
      description: |
        Generates a team roster / participant-list PNG for a match.

        **Same pattern as slot-list and standings export:**
        - Match ID is in the **path** (`id`), not the request body.
        - Pass `template` + `formatType` from `GET /quick-pt/templates`.
        - Node loads team data from slot assignments and forwards raw R2 template URLs to Python.

        ### Split export
        If team count exceeds template capacity (e.g. 22 teams on an 8-team template),
        Node generates multiple images automatically. Check `data.imageCount` and `data.images[]`.

        Team logos are resolved per slot (match logo → preset entry logo → none).
        Set logos via `POST .../slots/{slotNumber}/logo` or `POST .../slots/{slotId}/preset` — not in this request body.

        ### Customization groups
        | Group | Body fields | Python fields |
        |-------|-------------|---------------|
        | Shortcuts | `teamLogoSize`, `teamNameFontSize`, `teamNameColor` | top-level snake_case |
        | Header text/logos | `headerOverrides` | `header_overrides` |
        | Header styling | `headerStyle` | `header_style` |
        | Footer text | `footerOverrides` | `footer_overrides` |
        | Footer styling | `footerStyle` | `footer_style` |
        | Card layout | `cardOverrides` | `card_overrides` |
        | Fonts | `fontCustomization` | `font_customization` |

        Use snake_case keys inside override objects (same as Python curl).
        Offset rule: `+` = right/down, `-` = left/up.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterGraphicRequest"
            example:
              template: "team_roster1"
              formatType: "team_roster"
              headerOverrides:
                event_name: "BGMI SCRIMS"
                event_name_enabled: true
                title: "TEAM ROSTER"
                title_enabled: true
                sponsor_name: "Scrymz"
                sponsor_name_enabled: true
                organiser_name: "Tournament Ops"
                organiser_name_enabled: true
              headerStyle:
                event_name_color: "#1A1A1A"
                event_name_font_size: 28
                title_color: "#003366"
                title_font_size: 48
                sponsor_name_color: "#666666"
                sponsor_name_font_size: 22
                organiser_name_color: "#666666"
                organiser_name_font_size: 22
                sponsor_logo_size: 80
                organiser_logo_size: 80
              footerOverrides:
                social_enabled: true
                instagram_handle: "@scrymz"
                instagram_enabled: true
                discord_handle: "discord.gg/scrymz"
                discord_enabled: true
                youtube_handle: "@scrymz"
                youtube_enabled: true
              footerStyle:
                social_font_size: 18
                social_text_color: "#444444"
                social_icon_size: 32
                instagram_text_color: "#444444"
                discord_text_color: "#444444"
                youtube_text_color: "#444444"
              teamLogoSize: 64
              teamNameFontSize: 22
              teamNameColor: "#003366"
              cardOverrides:
                offset_x: 0
                offset_y: 0
                logo: { offset_x: 0, offset_y: 0 }
                team_name: { offset_x: 0, offset_y: 0 }
                team_logo_size: 64
                team_name_font_size: 22
                team_name_color: "#003366"
                slots:
                  "1":
                    logo: { offset_x: 0, offset_y: 0 }
                    team_name: { offset_x: 0, offset_y: 0 }
              fontCustomization:
                override_all_fonts: false
                header_font: { font_file: "built_titling_bd.ttf", color: "#1A1A1A" }
                sponsor_font: { font_file: "agency.ttf", color: "#666666" }
                organiser_font: { font_file: "california.otf", color: "#666666" }
                team_name_font: { font_file: "roboto_condensed_black.ttf", color: "#003366" }
                footer_font: { font_file: "coolvetica_rg.ttf", color: "#444444" }
                branding_font: { font_file: "agency_bold.ttf", color: "#888888" }
                global_size_multiplier: 1.0
              showBranding: true
              outputFilename: "team_roster.png"
      responses:
        "200":
          description: Roster graphic generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterGraphicResponse"
        "400":
          description: Validation error or no slots found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ══════════════════════════════════════════════════════════════════════
  # TOP-10 RANKINGS GRAPHIC
  # ══════════════════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/graphics/top-10:
    post:
      tags: [Quick-PT Graphics]
      summary: Generate top-10 rankings graphic for a match
      description: |
        Generates a top-10 rankings PNG from processed match results.

        **Same pattern as slot-list, roster, and standings export:**
        - Match ID is in the **path** (`id`), not the request body.
        - Pass `template` + `formatType` from `GET /quick-pt/templates`.
        - Node loads results from the match, sorts by total points (desc), takes top 10,
          attaches slot logos, and forwards raw R2 template URLs to Python.

        Team logos are resolved per result slot (match logo → preset entry logo → none).
        Set logos via `POST .../slots/{slotNumber}/logo` or `POST .../slots/{slotId}/preset` — not in this request body.

        ### Customization groups
        | Group | Body fields | Python fields |
        |-------|-------------|---------------|
        | Header text/logos | `headerOverrides` | `header_overrides` |
        | Footer text | `footerOverrides` | `footer_overrides` |
        | Card layout | `cardOverrides` | `card_overrides` |
        | Fonts | `fontCustomization` | `font_customization` |

        Use **snake_case** keys inside override objects (same as Python curl).
        Offset rule: `+` = right/down, `-` = left/up.

        ### Tuning tilted cards
        1. Call the API **without** `cardOverrides` first — inspect the base layout from the template config JSON.
        2. Nudge positions with small `offset_x` / `offset_y` values (try ±5, ±10).
        3. Add `rotation_deg` only on ranks that need it, under `cardOverrides.ranks["2"]`, etc.
        4. Adjust `team_logo_size`, `team_name_font_size`, or `points_font_size` at the top level of `cardOverrides`.

        Per-rank overrides live under `cardOverrides.ranks` — keys are rank numbers as strings (`"2"`, `"6"`, …).
        Each rank entry can set `rotation_deg`, plus nested `logo`, `team_name`, and `total_points` offsets.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Top10GraphicRequest"
            example:
              template: "t10template_1"
              formatType: "top_10"
              headerOverrides:
                event_name: "BGMI SCRIMS"
                event_name_enabled: true
                title: "TOP 10 TEAMS"
                title_enabled: true
              footerOverrides:
                social_enabled: true
                instagram_handle: "@scrymz"
                instagram_enabled: true
                discord_handle: "discord.gg/scrymz"
                discord_enabled: true
                youtube_handle: "@scrymz"
                youtube_enabled: true
              cardOverrides:
                rotation_deg: 0
                offset_x: 0
                offset_y: 0
                logo: { offset_x: 0, offset_y: 0 }
                team_name: { offset_x: 0, offset_y: 0 }
                total_points: { offset_x: 0, offset_y: 0 }
                team_logo_size: 72
                team_name_font_size: 24
                points_font_size: 20
                ranks:
                  "1":
                    rotation_deg: -8
                    team_logo_size: 80
                    team_name_font_size: 26
                    points_font_size: 22
                  "2":
                    rotation_deg: 6
                    team_logo_size: 72
                    team_name_font_size: 24
                    points_font_size: 20
              fontCustomization:
                override_all_fonts: false
                header_font: { font_file: "built_titling_bd.ttf", color: "#FFFFFF" }
                team_name_font: { font_file: "roboto_condensed_black.ttf", color: "#1A1A1A" }
                rank_font: { font_file: "agency_bold.ttf", color: "#FF6B00" }
                footer_font: { font_file: "coolvetica_rg.ttf", color: "#444444" }
                branding_font: { font_file: "agency_bold.ttf", color: "#888888" }
                global_size_multiplier: 1.0
              showBranding: true
              outputFilename: "top10_rankings.png"
      responses:
        "200":
          description: Top-10 rankings graphic generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top10GraphicResponse"
        "400":
          description: Validation error or no match results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  schemas:

    MediaAssetPreview:
      type: object
      properties:
        assetId:
          type: string
          example: "cmqqnxb6t00038za1l2k7jnzo"
        previewUrl:
          type: string
          format: uri
          description: |
            Signed preview URL — load directly in Coil/browser.
            Pattern: `/api/v1/quick-pt/files/{fileId}?exp=&sig=`
          example: "https://scrymzengineservice.site/api/v1/quick-pt/files/cmqqnxb6t00038za1l2k7jnzo?exp=1782757174&sig=d7510091..."
        signedUrl:
          type: string
          format: uri
          description: Same as previewUrl (Android fallback)
          example: "https://scrymzengineservice.site/api/v1/quick-pt/files/cmqqnxb6t00038za1l2k7jnzo?exp=1782757174&sig=d7510091..."
        expiresAt:
          type: string
          format: date-time
          description: ISO timestamp when previewUrl expires — re-call the generate/export API for a fresh URL
        previewUrlExpiresInSeconds:
          type: integer
          example: 1800

    MediaAssetListItem:
      allOf:
        - $ref: "#/components/schemas/MediaAssetPreview"
        - type: object
          properties:
            assetType:
              type: string
              enum: [STANDINGS, SLOT_LIST, ROSTER, TOP_10, SERIES_STANDINGS]
              example: "SLOT_LIST"
            filename:
              type: string
              nullable: true
              example: "slot_list_match1.png"
            metadata:
              type: object
              nullable: true
              additionalProperties: true
            createdAt:
              type: string
              format: date-time

    GeneratedGraphicImage:
      type: object
      properties:
        part:
          type: integer
          example: 1
        label:
          type: string
          enum: [main, overflow]
          example: "main"
        assetId:
          type: string
        previewUrl:
          type: string
          format: uri
        signedUrl:
          type: string
          format: uri
          deprecated: true
        filename:
          type: string
        teamCount:
          type: integer

    RosterGraphicRequest:
      type: object
      description: |
        Request body for team roster graphic generation.
        Match ID comes from path parameter `id`.
      properties:
        template:
          type: string
          example: "team_roster1"
          default: "team_roster1"
        formatType:
          type: string
          example: "team_roster"
          default: "team_roster"
        outputFilename:
          type: string
          example: "team_roster.png"
        headerOverrides:
          type: object
          nullable: true
          additionalProperties: true
        headerStyle:
          type: object
          nullable: true
          additionalProperties: true
        footerOverrides:
          type: object
          nullable: true
          additionalProperties: true
        footerStyle:
          type: object
          nullable: true
          additionalProperties: true
        teamLogoSize:
          type: number
          nullable: true
          example: 72
        teamNameFontSize:
          type: number
          nullable: true
          example: 17
        teamNameColor:
          type: string
          nullable: true
          example: "#1A1A1A"
        cardOverrides:
          type: object
          nullable: true
          description: |
            Global card overrides plus per-slot under `slots["1"]`, `slots["8"]`, etc.
          additionalProperties: true
        fontCustomization:
          type: object
          nullable: true
          description: |
            Per-role font overrides. Use snake_case keys inside (same as Python).
            Supports `override_all_fonts: false` to keep per-role fonts.
          additionalProperties: true
        advancedConfig:
          type: object
          nullable: true
          description: Optional advanced template overrides (forwarded as `advanced_config` to Python)
          additionalProperties: true
        showBranding:
          type: boolean
          example: true

    RosterGraphicResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Roster graphic generated successfully"
        data:
          type: object
          properties:
            assetId:
              type: string
            previewUrl:
              type: string
              format: uri
              description: First image preview URL — load with Bearer auth
            signedUrl:
              type: string
              format: uri
              deprecated: true
            generationTimeMs:
              type: integer
              example: 3200
            totalTeams:
              type: integer
              example: 22
            imageCount:
              type: integer
              example: 3
            images:
              type: array
              items:
                $ref: "#/components/schemas/GeneratedGraphicImage"
        meta:
          $ref: "#/components/schemas/MetaObject"

    Top10GraphicRequest:
      type: object
      description: |
        Request body for top-10 rankings graphic generation.
        Match ID comes from path parameter `id`. Rank data is loaded from match results — not sent in the body.
      properties:
        template:
          type: string
          example: "t10template_1"
          default: "t10template_1"
        formatType:
          type: string
          example: "top_10"
          default: "top_10"
        outputFilename:
          type: string
          pattern: '^[\w\-_.]+\.png$'
          example: "top10_rankings.png"
        headerOverrides:
          type: object
          nullable: true
          description: Header text toggles and content. Use snake_case keys.
          additionalProperties: true
        footerOverrides:
          type: object
          nullable: true
          description: Footer social handles and toggles. Use snake_case keys.
          additionalProperties: true
        cardOverrides:
          type: object
          nullable: true
          description: |
            Global card layout plus per-rank overrides under `ranks["1"]` … `ranks["10"]`.
            Global keys: `team_logo_size`, `team_name_font_size`, `points_font_size`,
            `logo`, `team_name`, `total_points` (each with `offset_x` / `offset_y`).
            Per-rank keys: `rotation_deg`, plus nested `logo`, `team_name`, `total_points` offsets.
          additionalProperties: true
        fontCustomization:
          type: object
          nullable: true
          description: Per-role font overrides. Supports `override_all_fonts`.
          properties:
            override_all_fonts:
              type: boolean
              example: false
            header_font:
              $ref: "#/components/schemas/FontRoleConfig"
            team_name_font:
              $ref: "#/components/schemas/FontRoleConfig"
            rank_font:
              $ref: "#/components/schemas/FontRoleConfig"
            footer_font:
              $ref: "#/components/schemas/FontRoleConfig"
            branding_font:
              $ref: "#/components/schemas/FontRoleConfig"
            global_size_multiplier:
              type: number
              minimum: 0.1
              maximum: 10
              example: 1.0
        advancedConfig:
          type: object
          nullable: true
          description: Optional advanced template overrides (forwarded as `advanced_config` to Python)
          additionalProperties: true
        showBranding:
          type: boolean
          example: true

    Top10GraphicResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Top-10 rankings graphic generated successfully"
        data:
          type: object
          properties:
            assetId:
              type: string
            previewUrl:
              type: string
              format: uri
              description: Load with Authorization Bearer header
            signedUrl:
              type: string
              format: uri
              deprecated: true
            generationTimeMs:
              type: integer
              example: 2800
            rankCount:
              type: integer
              description: Number of teams included (max 10)
              example: 10
        meta:
          $ref: "#/components/schemas/MetaObject"

    SlotListGraphicRequest:
      type: object
      description: |
        Request body for slot-list graphic generation.
        Match ID is **not** in this object — it comes from the path parameter `id`.
      properties:
        template:
          type: string
          description: Template name from GET /quick-pt/templates (e.g. sl1)
          example: "sl1"
          default: "sl1"
        formatType:
          type: string
          description: Category key from GET /quick-pt/templates
          example: "slot_list"
          default: "slot_list"
        outputFilename:
          type: string
          description: Optional custom PNG filename stored in R2
          example: "slot_list_match1.png"
        headerOverrides:
          type: object
          nullable: true
          description: Patch named header text fields (snake_case keys forwarded to Python)
          additionalProperties: true
          example:
            extra_text_info: "BGMI SCRIMS"
            information: "Group A — Day 1"
        slotNumberFontSize:
          type: number
          nullable: true
          description: Font size (px) for all slot number labels
          example: 26
        teamNameFontSize:
          type: number
          nullable: true
          description: Font size (px) for all team name labels
          example: 24
        slotNumberColor:
          type: string
          nullable: true
          example: "#1A1A1A"
        teamNameColor:
          type: string
          nullable: true
          example: "#003366"
        teamLogoGap:
          type: number
          nullable: true
          description: Gap (px) between logo and team name
          example: 14
        teamLogoSize:
          type: number
          nullable: true
          description: Logo square size (px)
          example: 52
        gridOverrides:
          type: object
          nullable: true
          description: |
            Grid layout controls (snake_case keys forwarded to Python).
            - `row_offset_y` — shift every row vertically
            - `team_name` — `{ offset_y, font_size, color }` for all team names
            - `slot_number` — `{ font_size, color }` for all slot numbers
          additionalProperties: true
        fontCustomization:
          type: object
          nullable: true
          description: Per-role font overrides. Font IDs from GET /quick-pt/fonts.
          properties:
            header_font:
              $ref: "#/components/schemas/FontRoleConfig"
            slot_number_font:
              $ref: "#/components/schemas/FontRoleConfig"
            team_name_font:
              $ref: "#/components/schemas/FontRoleConfig"
            footer_font:
              $ref: "#/components/schemas/FontRoleConfig"
            branding_font:
              $ref: "#/components/schemas/FontRoleConfig"
            global_size_multiplier:
              type: number
              minimum: 0.1
              maximum: 10
              example: 1.0

    SlotListGraphicResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Slot list graphic generated successfully"
        data:
          type: object
          properties:
            assetId:
              type: string
            previewUrl:
              type: string
              format: uri
              description: Load with Authorization Bearer header
            signedUrl:
              type: string
              format: uri
              deprecated: true
            generationTimeMs:
              type: integer
              example: 2400
            slotCount:
              type: integer
              description: Number of slots included in the image (max 24)
              example: 20
        meta:
          $ref: "#/components/schemas/MetaObject"
