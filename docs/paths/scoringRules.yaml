# ══════════════════════════════════════════════════════════════════════════════
# SCORING RULES MODULE — docs/paths/scoringRules.yaml
#
# Routes: /scoring-rules/tournaments/{tournamentId}/rules
#         /scoring-rules/rules/{ruleId}
#         /scoring-rules/templates, /scoring-rules/validate
#
# Base URL: /api/v1  (see servers in docs/swagger.yaml)
# Auth: JWT Bearer on every endpoint.
#
# Integration flow (tournament setup):
#   1. GET  /scoring-rules/templates              → pick a preset
#   2. POST /scoring-rules/tournaments/{id}/apply-template
#      OR  POST /scoring-rules/tournaments/{id}/rules
#   3. POST /scoring-rules/tournaments/{id}/calculate  → preview points
# ══════════════════════════════════════════════════════════════════════════════

components:

  schemas:

    ScoringRuleType:
      type: string
      enum: [KILL_POINTS, POSITION_POINTS, SURVIVAL_TIME, CUSTOM_FORMULA]
      example: KILL_POINTS

    ScoringRuleObject:
      type: object
      description: Scoring rule record (Redis-first, async DB sync)
      required: [id, tournamentId, ruleName, ruleType, isActive, priority, killPoints, positionMultiplier, createdBy, createdAt, updatedAt, dbStatus]
      properties:
        id:
          type: string
          format: uuid
          example: "623e4567-e89b-12d3-a456-426614174006"
        tournamentId:
          type: string
          format: uuid
        ruleName:
          type: string
          example: "Standard BGMI"
        ruleType:
          $ref: '#/components/schemas/ScoringRuleType'
        isActive:
          type: boolean
          example: true
        priority:
          type: integer
          minimum: 1
          example: 1
          description: Higher priority rules are applied first. Unique per tournament when active.
        killPoints:
          type: integer
          minimum: 0
          example: 1
        positionMultiplier:
          type: number
          minimum: 0
          example: 2
        customFormula:
          type: string
          nullable: true
          example: "kills * 2 + (26 - position)"
          description: Used when ruleType is CUSTOM_FORMULA
        description:
          type: string
          nullable: true
          example: "Standard BGMI tournament scoring"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED, ERROR]
          example: PENDING_SYNC

    CreateScoringRuleRequest:
      type: object
      required: [ruleName, ruleType, killPoints, positionMultiplier]
      properties:
        ruleName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Standard BGMI"
        ruleType:
          $ref: '#/components/schemas/ScoringRuleType'
        killPoints:
          type: integer
          minimum: 0
          example: 1
        positionMultiplier:
          type: number
          minimum: 0
          example: 2
        customFormula:
          type: string
          maxLength: 1000
        description:
          type: string
          maxLength: 500
          example: "1 point per kill, 2x placement multiplier"
        priority:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          example: 1

    UpdateScoringRuleRequest:
      type: object
      minProperties: 1
      properties:
        ruleName:
          type: string
          minLength: 1
          maxLength: 100
        ruleType:
          $ref: '#/components/schemas/ScoringRuleType'
        killPoints:
          type: integer
          minimum: 0
        positionMultiplier:
          type: number
          minimum: 0
        customFormula:
          type: string
          maxLength: 1000
        description:
          type: string
          maxLength: 500
        priority:
          type: integer
          minimum: 1
          maximum: 100
        isActive:
          type: boolean

    ScoringRuleListData:
      type: object
      required: [rules, count]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ScoringRuleObject'
        count:
          type: integer
          example: 2

    CalculateScoreRequest:
      type: object
      required: [kills, position]
      properties:
        kills:
          type: integer
          minimum: 0
          maximum: 100
          example: 12
        position:
          type: integer
          minimum: 1
          maximum: 100
          example: 3
        survivalTime:
          type: number
          minimum: 0
          example: 1200
          description: Survival time in seconds (used by SURVIVAL_TIME rules)
        damage:
          type: number
          minimum: 0
          example: 1850
          description: Passed to custom formula context as `damage`

    ScoreBreakdownItem:
      type: object
      required: [ruleName, ruleType, points, calculation]
      properties:
        ruleName:
          type: string
          example: "Standard BGMI"
        ruleType:
          $ref: '#/components/schemas/ScoringRuleType'
        points:
          type: integer
          example: 12
        calculation:
          type: string
          example: "12 kills × 1 = 12"

    ScoreCalculationResultObject:
      type: object
      required: [totalScore, killPoints, positionPoints, breakdown]
      properties:
        totalScore:
          type: integer
          example: 58
        killPoints:
          type: integer
          example: 12
        positionPoints:
          type: integer
          example: 46
        survivalPoints:
          type: integer
          example: 0
        customPoints:
          type: integer
          example: 0
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ScoreBreakdownItem'

    ApplyTemplateRequest:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
          example: "standard-bgmi"
          description: One of the IDs from GET /scoring-rules/templates

    ScoringRuleTemplateObject:
      type: object
      required: [id, name, description, ruleType, defaultKillPoints, defaultPositionMultiplier, isPopular, usageCount]
      properties:
        id:
          type: string
          example: "standard-bgmi"
        name:
          type: string
          example: "Standard BGMI"
        description:
          type: string
          example: "Standard BGMI tournament scoring"
        ruleType:
          $ref: '#/components/schemas/ScoringRuleType'
        defaultKillPoints:
          type: integer
          example: 1
        defaultPositionMultiplier:
          type: number
          example: 2
        customFormula:
          type: string
          nullable: true
        isPopular:
          type: boolean
          example: true
        usageCount:
          type: integer
          example: 0

    ScoringRuleTemplateListData:
      type: object
      required: [templates, count]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/ScoringRuleTemplateObject'
        count:
          type: integer
          example: 2

    BulkCreateScoringRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateScoringRuleRequest'
        replaceExisting:
          type: boolean
          default: false
          description: When true, deletes all existing tournament rules before creating new ones

    BulkScoringRuleResultObject:
      type: object
      required: [success, createdCount, updatedCount, deletedCount, errors]
      properties:
        success:
          type: boolean
          example: true
        createdCount:
          type: integer
          example: 2
        updatedCount:
          type: integer
          example: 0
        deletedCount:
          type: integer
          example: 0
        errors:
          type: array
          items:
            type: string
          example: []

    ScoringRuleValidationError:
      type: object
      required: [field, error, message]
      properties:
        field:
          type: string
          example: "killPoints"
        error:
          type: string
          enum: [INVALID_FORMULA, NEGATIVE_POINTS, DUPLICATE_PRIORITY, MISSING_REQUIRED]
        message:
          type: string
          example: "Kill points cannot be negative"

    ScoringRuleValidationWarning:
      type: object
      required: [field, warning, message]
      properties:
        field:
          type: string
          example: "killPoints"
        warning:
          type: string
          enum: [HIGH_KILL_POINTS, LOW_POSITION_MULTIPLIER, COMPLEX_FORMULA]
        message:
          type: string
          example: "High kill points may unbalance the scoring"

    ScoringRuleValidationResult:
      type: object
      required: [isValid, errors, warnings]
      properties:
        isValid:
          type: boolean
          example: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ScoringRuleValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ScoringRuleValidationWarning'

    ScoringRuleSuccessEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
        meta:
          $ref: '#/components/schemas/MetaObject'

paths:

  /scoring-rules/tournaments/{tournamentId}/rules:
    get:
      tags: [Scoring Rules]
      summary: List scoring rules for tournament
      description: Returns rules sorted by priority (highest first). Returns 404 when no rules exist.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Rules retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament scoring rules retrieved successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleListData'
              example:
                success: true
                message: "Tournament scoring rules retrieved successfully"
                data:
                  rules:
                    - id: "623e4567-e89b-12d3-a456-426614174006"
                      tournamentId: "123e4567-e89b-12d3-a456-426614174000"
                      ruleName: "Standard BGMI"
                      ruleType: "KILL_POINTS"
                      isActive: true
                      priority: 1
                      killPoints: 1
                      positionMultiplier: 2
                      customFormula: null
                      description: "Standard BGMI tournament scoring"
                      createdBy: "456e7890-e12c-34f5-b678-789012345678"
                      createdAt: "2024-01-15T10:30:00.000Z"
                      updatedAt: "2024-01-15T10:30:00.000Z"
                      dbStatus: "PENDING_SYNC"
                  count: 1
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Scoring Rules]
      summary: Create scoring rule
      description: |
        Creates a rule for the tournament. Priority must be unique among active rules.
        Position points formula: `(26 - position) × positionMultiplier`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoringRuleRequest'
            example:
              ruleName: "Standard BGMI"
              ruleType: "KILL_POINTS"
              killPoints: 1
              positionMultiplier: 2
              description: "1 point per kill"
              priority: 1
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring rule created successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /scoring-rules/tournaments/{tournamentId}/rules/bulk:
    post:
      tags: [Scoring Rules]
      summary: Bulk create scoring rules
      description: >
        Creates multiple rules. Set replaceExisting to true to wipe existing rules first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateScoringRulesRequest'
            example:
              replaceExisting: false
              rules:
                - ruleName: "Kill Points"
                  ruleType: "KILL_POINTS"
                  killPoints: 1
                  positionMultiplier: 1
                  priority: 2
                - ruleName: "Placement Points"
                  ruleType: "POSITION_POINTS"
                  killPoints: 0
                  positionMultiplier: 2
                  priority: 1
      responses:
        '201':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Bulk scoring rules created"
                      data:
                        $ref: '#/components/schemas/BulkScoringRuleResultObject'
              example:
                success: true
                message: "Bulk scoring rules created"
                data:
                  success: true
                  createdCount: 2
                  updatedCount: 0
                  deletedCount: 0
                  errors: []
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /scoring-rules/tournaments/{tournamentId}/calculate:
    post:
      tags: [Scoring Rules]
      summary: Calculate score preview
      description: |
        Applies active tournament rules to the given kills/position input.
        Falls back to default BGMI scoring (1 pt/kill, `(26-position)×2` placement) when no rules exist.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateScoreRequest'
            example:
              kills: 12
              position: 3
              survivalTime: 1200
              damage: 1850
      responses:
        '200':
          description: Score calculated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Score calculated successfully"
                      data:
                        $ref: '#/components/schemas/ScoreCalculationResultObject'
              example:
                success: true
                message: "Score calculated successfully"
                data:
                  totalScore: 58
                  killPoints: 12
                  positionPoints: 46
                  survivalPoints: 0
                  customPoints: 0
                  breakdown:
                    - ruleName: "Standard BGMI"
                      ruleType: "KILL_POINTS"
                      points: 12
                      calculation: "12 kills × 1 = 12"
                    - ruleName: "Standard BGMI"
                      ruleType: "POSITION_POINTS"
                      points: 46
                      calculation: "(26 - 3) × 2 = 46"
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /scoring-rules/tournaments/{tournamentId}/apply-template:
    post:
      tags: [Scoring Rules]
      summary: Apply scoring template
      description: |
        Creates a rule from a built-in template. Available template IDs:
        `standard-bgmi`, `pmco-style` (see GET /scoring-rules/templates).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplateRequest'
            example:
              templateId: "standard-bgmi"
      responses:
        '201':
          description: Template applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring template applied successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /scoring-rules/rules/{ruleId}:
    get:
      tags: [Scoring Rules]
      summary: Get scoring rule by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScoringRuleIdPath'
      responses:
        '200':
          description: Rule retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring rule retrieved successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleObject'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Scoring Rules]
      summary: Update scoring rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScoringRuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScoringRuleRequest'
            example:
              killPoints: 2
              isActive: true
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring rule updated successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Scoring Rules]
      summary: Delete scoring rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScoringRuleIdPath'
      responses:
        '200':
          description: Rule deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring rule deleted successfully"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /scoring-rules/templates:
    get:
      tags: [Scoring Rules]
      summary: List popular scoring templates
      description: Returns built-in presets from `POPULAR_SCORING_TEMPLATES` in the codebase.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Templates retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Popular scoring templates retrieved successfully"
                      data:
                        $ref: '#/components/schemas/ScoringRuleTemplateListData'
              example:
                success: true
                message: "Popular scoring templates retrieved successfully"
                data:
                  templates:
                    - id: "standard-bgmi"
                      name: "Standard BGMI"
                      description: "Standard BGMI tournament scoring"
                      ruleType: "KILL_POINTS"
                      defaultKillPoints: 1
                      defaultPositionMultiplier: 2
                      isPopular: true
                      usageCount: 0
                    - id: "pmco-style"
                      name: "PMCO Style"
                      description: "PUBG Mobile Club Open scoring"
                      ruleType: "KILL_POINTS"
                      defaultKillPoints: 2
                      defaultPositionMultiplier: 1.5
                      isPopular: true
                      usageCount: 0
                  count: 2
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /scoring-rules/validate:
    post:
      tags: [Scoring Rules]
      summary: Validate scoring rule fields
      description: Dry-run validation without persisting. Returns errors and warnings arrays.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoringRuleRequest'
            example:
              ruleName: "Custom Rule"
              ruleType: "CUSTOM_FORMULA"
              killPoints: 1
              positionMultiplier: 2
              customFormula: "kills * 2 + (26 - position)"
      responses:
        '200':
          description: Validation complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScoringRuleSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Scoring rule validation complete"
                      data:
                        $ref: '#/components/schemas/ScoringRuleValidationResult'
              example:
                success: true
                message: "Scoring rule validation complete"
                data:
                  isValid: true
                  errors: []
                  warnings: []
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  parameters:

    ScoringRuleIdPath:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "623e4567-e89b-12d3-a456-426614174006"
