            summary:
              type: object
              properties:
                total:
                  type: integer
                  example: 16
                successful:
                  type: integer
                  example: 16
                failed:
                  type: integer
                  example: 0
        meta:
          $ref: "#/components/schemas/MetaObject"

    # ── Common ───────────────────────────────────────────────

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3

    SuccessNoData:
