  /quick-pt/matches/{id}/screenshots:
    post:
      tags: [Quick-PT Screenshots]
      summary: Upload screenshots
      description: |
        Upload attendance or result screenshots to Cloudflare R2.
        Response includes fresh signed `previewUrl` for each uploaded file (5 min TTL).

        - Pass screenshot type via query param: `?type=ATTENDANCE` or `?type=RESULT`
        - Max 10 files per request, 10 MB each
        - Supported formats: PNG, JPG, JPEG, WebP
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
          example: "ATTENDANCE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                pageNumber:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "201":
          description: Screenshots uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      uploaded:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScreenshotObject"
                      errors:
                        type: array
                        items:
                          type: string
                      uploadId:
                        type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Screenshots]
      summary: List screenshots for a match
      description: |
        Returns all uploaded screenshots with **fresh signed preview URLs** (5 min TTL).
        URLs are regenerated on every request — call again when previews expire.

        Response includes flat `screenshots` array plus grouped `attendance` and `result` lists.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
        - in: query
          name: isProcessed
          schema:
            type: boolean
      responses:
        "200":
          description: Screenshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots retrieved successfully"
                  data:
                    $ref: "#/components/schemas/ScreenshotListResponse"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/screenshots/{screenshotId}:
    delete:
      tags: [Quick-PT Screenshots]
      summary: Delete a screenshot
      description: "Deletes screenshot record from database and the file from Cloudflare R2 storage."
      security:
