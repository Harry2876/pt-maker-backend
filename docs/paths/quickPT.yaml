# Quick PT Module — docs/paths/quickPT.yaml
# Base: /api/v1/quick-pt
# All routes require: Authorization: Bearer <token>

paths:

  # ══════════════════════════════════════════════════════════
  # QUICK MATCHES
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches:
    post:
      tags: [Quick-PT]
      summary: Create a Quick Match
      description: |
        Creates a Quick Match with a custom scoring configuration.
        This is always **Step 1** of the Quick PT flow.

        **Complete flow (all steps):**
        1. **Create match** ← you are here
        2. *(Optional)* `POST /slots/parse` — pre-set team names by slot number
        3. `POST /screenshots?type=ATTENDANCE` — upload attendance images (≤ 3)
        4. `POST /screenshots?type=RESULT` — upload result images (≤ 9)
        5. `POST /process` with `{ "type": "ATTENDANCE" }` — OCR attendance
        6. `POST /process` with `{ "type": "RESULT" }` — OCR results + calculate points
        7. `GET /results` — verify final standings
        8. `GET /templates` → `POST /export` — generate standings PNG
        9. Receive `signedImageUrl` — valid 30 minutes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchName]
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "BGMI Scrims Day 1"
                game:
                  type: string
                  default: "BGMI"
                  example: "BGMI"
                map:
                  type: string
                  example: "Erangel"
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                  description: "10 integers — points for positions 1 through 10"
                  example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
                killPointsValue:
                  type: integer
                  minimum: 0
                  default: 1
                  example: 1
                scoringDescription:
                  type: string
                  maxLength: 200
                  example: "Standard BGMI scoring"
      responses:
        "201":
          description: Quick Match created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match created successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT]
      summary: List all Quick Matches for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, ERROR]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matches retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Matches retrieved successfully"
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuickMatchBasic"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}:
    get:
      tags: [Quick-PT]
      summary: Get Quick Match by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT]
      summary: Update Quick Match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                map:
                  type: string
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                killPointsValue:
                  type: integer
                  minimum: 0
                scoringDescription:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match updated successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT]
      summary: Delete Quick Match
      description: "Permanently deletes the match and all related data — slots, screenshots, results, points tables."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # SLOTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/slots/parse:
    post:
      tags: [Quick-PT Slots]
      summary: Parse and create slots from plain text
      description: |
        Parse a multi-line text block into slot assignments in one call.

        **Supported formats:**
        - `Slot 1 - Team Alpha`
        - `1. Team Alpha`
        - `Slot 1: Team Alpha`
        - `Slot 1 Team Alpha`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotsText]
              properties:
                slotsText:
                  type: string
                  example: "Slot 1: Team Alpha\nSlot 2: Team Beta\nSlot 3: Team Gamma"
      responses:
        "201":
          description: Slots parsed and created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots created successfully"
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          $ref: "#/components/schemas/SlotObject"
                      errors:
                        type: array
                        items:
                          type: string
                        example: ["Line 5: Invalid format"]
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/slots:
    post:
      tags: [Quick-PT Slots]
      summary: Create a single slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                playerNames:
                  type: array
                  items:
                    type: string
                  example: ["Player1", "Player2", "Player3", "Player4"]
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot created successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Slots]
      summary: List all slots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
        - in: query
          name: detectedInAttendance
          schema:
            type: boolean
      responses:
        "200":
          description: Slots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT Slots]
      summary: Delete all slots for a match
      description: "Remove all slot assignments. Useful before re-uploading corrected slots."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: All slots deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All slots deleted successfully"
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/slots/{slotId}:
    put:
      tags: [Quick-PT Slots]
      summary: Update a slot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slotId
          required: true
          schema:
            type: string
            format: uuid
          description: "Slot ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  format: uuid
                  example: "clx123abc456"
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 5
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha Updated"
                playerNames:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
                detectedInAttendance:
                  type: boolean
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot updated successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # SCREENSHOTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/screenshots:
    post:
      tags: [Quick-PT Screenshots]
      summary: Upload screenshots
      description: |
        Upload attendance or result screenshots to Cloudflare R2.

        - Pass screenshot type via query param: `?type=ATTENDANCE` or `?type=RESULT`
        - Max 10 files per request, 10 MB each
        - Supported formats: PNG, JPG, JPEG, WebP
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
          example: "ATTENDANCE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                pageNumber:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "201":
          description: Screenshots uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      uploaded:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScreenshotObject"
                      errors:
                        type: array
                        items:
                          type: string
                      uploadId:
                        type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Screenshots]
      summary: List screenshots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
        - in: query
          name: isProcessed
          schema:
            type: boolean
      responses:
        "200":
          description: Screenshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScreenshotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/screenshots/{screenshotId}:
    delete:
      tags: [Quick-PT Screenshots]
      summary: Delete a screenshot
      description: "Deletes screenshot record from database and the file from Cloudflare R2 storage."
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: screenshotId
          required: true
          schema:
            type: string
            format: uuid
          description: "Screenshot ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  format: uuid
                  example: "clx123abc456"
                  description: "Required to verify ownership"
      responses:
        "200":
          description: Screenshot deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # AI PROCESSING
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/process:
    post:
      tags: [Quick-PT Processing]
      summary: Process match screenshots with Python AI
      description: |
        Unified endpoint for all screenshot processing steps. Forwards uploaded screenshots
        to the Python AI service and writes the extracted data back to the database.

        ### Processing types

        | `type` | Description |
        |---|---|
        | `ATTENDANCE` | Sends attendance screenshots to Python AI OCR. Detects slot numbers and full player rosters. Creates slot records in the DB with `playerNames` stored for later matching. |
        | `RESULT` | Sends result screenshots to Python AI OCR. Extracts team rankings and kill counts. Matches result teams to attendance slots using **fuzzy roster comparison** (see below). Calculates points. Writes results to DB. |
        | `COMPLETE` *(default)* | Runs `ATTENDANCE` then `RESULT` sequentially in one request. |

        ### Image types
        - **Attendance screenshots** (`expanded_layout`) — taken before the match. Each image shows
          ~6 teams with their slot numbers and full player lists.
        - **Result screenshots** (`compact_layout`) — taken after the match ends. Each image shows
          ~2–3 teams with their final rank and per-player kill count.

        Python AI auto-detects layout type from the screenshot — no need to specify.

        ### Roster-based team matching (RESULT step)
        Because OCR can vary between image types, teams are matched by comparing **all player names**
        across the result screenshot against the player names stored during the attendance step.
        The algorithm uses (in order):
        - Exact normalised match (lowercase, strip non-alphanumeric)
        - Prefix / substring match (≥ 4 chars)
        - Proportional Levenshtein distance: ≤ 2 for 6–8 char names, ≤ 3 for 9–11 chars, ≤ 4 for ≥ 12 chars
        - Bigram similarity ≥ 70 % (Sørensen–Dice) as a final fallback

        **Only one matching player is required** — the slot with the highest match count wins.
        Unmatched teams appear in `warnings`.

        ### Prerequisites
        - Screenshots must be uploaded before processing (`POST /quick-pt/matches/{id}/screenshots`).
        - Attendance must be processed before results — slot records must exist for team matching.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [ATTENDANCE, RESULT, COMPLETE]
                  default: COMPLETE
                  description: "Which processing step to run"
                  example: "ATTENDANCE"
      responses:
        "200":
          description: Processing completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Attendance processed successfully"
                  data:
                    type: object
                    description: "Shape varies by type. See examples below."
                    oneOf:
                      - title: ATTENDANCE response
                        properties:
                          slotsDetected:
                            type: integer
                            description: "Teams detected by Python AI across all screenshots"
                            example: 16
                          slotsCreated:
                            type: integer
                            description: "New slot records created in the database"
                            example: 14
                          warnings:
                            type: array
                            description: "Non-fatal issues (e.g. slot already exists, low confidence)"
                            items:
                              $ref: "#/components/schemas/ProcessingWarning"
                          processingTimeMs:
                            type: integer
                            example: 4250
                          confidence:
                            type: object
                            properties:
                              overall:
                                type: number
                                format: float
                                minimum: 0
                                maximum: 1
                                description: "Fraction of screenshots successfully processed"
                                example: 1.0
                              slotExtraction:
                                type: number
                                format: float
                                example: 1.0
                      - title: RESULT response
                        properties:
                          resultsCreated:
                            type: integer
                            description: "Result records written to database"
                            example: 16
                          resultsProcessed:
                            type: integer
                            description: "Teams extracted from all result screenshots"
                            example: 16
                          warnings:
                            type: array
                            description: "Non-fatal issues (e.g. team not matched to an existing slot)"
                            items:
                              $ref: "#/components/schemas/ProcessingWarning"
                          processingTimeMs:
                            type: integer
                            example: 6800
                          confidence:
                            type: object
                            properties:
                              overall:
                                type: number
                                format: float
                                minimum: 0
                                maximum: 1
                                example: 0.88
                              resultExtraction:
                                type: number
                                format: float
                                example: 0.88
                      - title: COMPLETE response
                        properties:
                          attendanceResult:
                            type: object
                            description: "Output from ATTENDANCE step"
                            properties:
                              slotsDetected:
                                type: integer
                                example: 16
                              slotsCreated:
                                type: integer
                                example: 16
                              warnings:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ProcessingWarning"
                              processingTimeMs:
                                type: integer
                                example: 4200
                          resultProcessingResult:
                            type: object
                            description: "Output from RESULT step"
                            properties:
                              resultsCreated:
                                type: integer
                                example: 16
                              resultsProcessed:
                                type: integer
                                example: 16
                              warnings:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ProcessingWarning"
                              processingTimeMs:
                                type: integer
                                example: 6800
                          totalProcessingTimeMs:
                            type: integer
                            description: "Total wall-clock time for both steps"
                            example: 11000
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          description: |
            - No screenshots found for the requested type
            - Wrong image type (e.g. attendance screenshot sent for `RESULT` step)
            - Invalid `type` value
            - No slots found when trying to process results (attendance not done yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # RESULTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/results:
    get:
      tags: [Quick-PT Results]
      summary: Get all results for a match
      description: "Returns AI-processed or manually entered results sorted by position ascending."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match results retrieved successfully"
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResultItem"
                      count:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/results/manual:
    post:
      tags: [Quick-PT Results]
      summary: Create a manual result entry
      description: |
        Manually enter a team result without AI processing.
        Points are automatically calculated from the match's scoring configuration.
        Sets match status to `COMPLETED`.
      security:
        - bearerAuth: []
      parameters:
