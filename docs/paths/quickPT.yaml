# Quick PT Module — docs/paths/quickPT.yaml
# Base: /api/v1/quick-pt
# All routes require: Authorization: Bearer <token>

paths:

  # QUICK MATCHES

  /quick-pt/matches:
    post:
      tags: [Quick-PT]
      summary: Create a Quick Match
      description: |
        Creates a Quick Match with custom scoring configuration.
        Workflow: Create match -> Upload slots -> Upload screenshots -> Process with AI -> Export points table
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchName]
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "BGMI Scrims Day 1"
                game:
                  type: string
                  default: "BGMI"
                  example: "BGMI"
                map:
                  type: string
                  example: "Erangel"
                positionPointsConfig:
                  type: array
                  items:
                    type: integer
                  description: "10 integers for rank 1-10 position points"
                  example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
                killPointsValue:
                  type: integer
                  default: 1
                  example: 1
                scoringDescription:
                  type: string
                  example: "Standard BGMI scoring"
      responses:
        "201":
          description: Quick Match created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match created successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchBasic"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT]
      summary: List all Quick Matches for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [CREATED, SLOTS_UPLOADED, ATTENDANCE_UPLOADED, RESULTS_UPLOADED, PROCESSING, COMPLETED, ERROR]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Matches retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Matches retrieved successfully"
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuickMatchBasic"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}:
    get:
      tags: [Quick-PT]
      summary: Get Quick Match by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT]
      summary: Update Quick Match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                map:
                  type: string
                positionPointsConfig:
                  type: array
                  items:
                    type: integer
                killPointsValue:
                  type: integer
                scoringDescription:
                  type: string
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match updated successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchBasic"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT]
      summary: Delete Quick Match
      description: Permanently deletes the match and all related data — slots, screenshots, results, points tables.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # SLOTS

  /quick-pt/matches/{id}/slots/parse:
    post:
      tags: [Quick-PT Slots]
      summary: Parse slots from text
      description: |
        Parse multi-line text into slot assignments.
        Supported formats: "Slot 1 - Team A", "1. Team A", "Slot 1: Team A", "Slot 1 Team A"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotsText]
              properties:
                slotsText:
                  type: string
                  example: "Slot 1: Team Alpha\nSlot 2: Team Beta\nSlot 3: Team Gamma"
      responses:
        "201":
          description: Slots parsed and created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots created successfully"
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          $ref: "#/components/schemas/SlotObject"
                      errors:
                        type: array
                        items:
                          type: string
                        example: ["Line 5: Invalid format"]
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/slots:
    post:
      tags: [Quick-PT Slots]
      summary: Create a single slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                playerNames:
                  type: array
                  items:
                    type: string
                  example: ["Player1", "Player2", "Player3", "Player4"]
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot created successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Slots]
      summary: List all slots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
        - in: query
          name: detectedInAttendance
          schema:
            type: boolean
      responses:
        "200":
          description: Slots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT Slots]
      summary: Delete all slots for a match
      description: Remove all slot assignments. Useful for re-uploading corrected slots.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: All slots deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All slots deleted successfully"
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/slots/{slotId}:
    put:
      tags: [Quick-PT Slots]
      summary: Update a slot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slotId
          required: true
          schema:
            type: string
          example: "slot_xyz789"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  example: "clx123abc456"
                slotNumber:
                  type: integer
                  example: 5
                teamName:
                  type: string
                  example: "Team Alpha Updated"
                playerNames:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot updated successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # SCREENSHOTS

  /quick-pt/matches/{id}/screenshots:
    post:
      tags: [Quick-PT Screenshots]
      summary: Upload screenshots
      description: |
        Upload attendance or result screenshots to Cloudflare R2.
        Pass type as query param: ?type=ATTENDANCE or ?type=RESULT
        Max 10 files, 10MB each. Supported: PNG, JPG, JPEG, WebP.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
          example: "ATTENDANCE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                pageNumber:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "201":
          description: Screenshots uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      uploaded:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScreenshotObject"
                      errors:
                        type: array
                        items:
                          type: string
                      uploadId:
                        type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Screenshots]
      summary: List screenshots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
        - in: query
          name: isProcessed
          schema:
            type: boolean
      responses:
        "200":
          description: Screenshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScreenshotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/screenshots/{screenshotId}:
    delete:
      tags: [Quick-PT Screenshots]
      summary: Delete a screenshot
      description: Deletes screenshot from database and Cloudflare R2 storage.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: screenshotId
          required: true
          schema:
            type: string
          example: "screenshot_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  example: "clx123abc456"
      responses:
        "200":
          description: Screenshot deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # AI PROCESSING

  /quick-pt/matches/{id}/process/attendance:
    post:
      tags: [Quick-PT Processing]
      summary: Process attendance screenshots with AI
      description: Sends attendance screenshots to Python AI for player detection and slot matching.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Attendance processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Attendance processed successfully"
                  data:
                    type: object
                    properties:
                      teamsDetected:
                        type: integer
                        example: 16
                      teamsMatched:
                        type: integer
                        example: 15
                      teamsNotFound:
                        type: integer
                        example: 1
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/process/results:
    post:
      tags: [Quick-PT Processing]
      summary: Process result screenshots with AI
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                useGeminiFallback:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Results processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Results processed successfully"
                  data:
                    type: object
                    properties:
                      resultsCount:
                        type: integer
                        example: 16
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResultItem"
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/process/complete:
    post:
      tags: [Quick-PT Processing]
      summary: Run complete processing workflow (attendance + results)
      description: Processes attendance and results in sequence, then sets match status to COMPLETED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                skipAttendance:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match processing completed successfully"
                  data:
                    type: object
                    properties:
                      matchId:
                        type: string
                      status:
                        type: string
                        example: "COMPLETED"
                      attendance:
                        type: object
                        properties:
                          teamsDetected:
                            type: integer
                          teamsMatched:
                            type: integer
                          warnings:
                            type: array
                            items:
                              type: string
                      results:
                        type: object
                        properties:
                          resultsCount:
                            type: integer
                          warnings:
                            type: array
                            items:
                              type: string
                      processingTime:
                        type: number
                        example: 45.3
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # RESULTS

  /quick-pt/matches/{id}/results:
    get:
      tags: [Quick-PT Results]
      summary: Get all results for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match results retrieved successfully"
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResultItem"
                      count:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/results/manual:
    post:
      tags: [Quick-PT Results]
      summary: Create manual result entry
      description: Manually enter a team result without AI processing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName, position, totalKills]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 25
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                position:
                  type: integer
                  minimum: 1
                  maximum: 25
                  example: 1
                totalKills:
                  type: integer
                  minimum: 0
                  maximum: 99
                  example: 12
                playerResults:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [playerName, kills]
                    properties:
                      playerName:
                        type: string
                        example: "Player1"
                      kills:
                        type: integer
                        minimum: 0
                        example: 5
                entryNotes:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Manual result created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Manual result created successfully"
                  data:
                    $ref: "#/components/schemas/MatchResultItem"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/results/bulk:
    post:
      tags: [Quick-PT Results]
      summary: Create multiple results in bulk (up to 25)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [slotNumber, teamName, position, totalKills]
                    properties:
                      slotNumber:
                        type: integer
                        minimum: 1
                        maximum: 25
                      teamName:
                        type: string
                      position:
                        type: integer
                        minimum: 1
                        maximum: 25
                      totalKills:
                        type: integer
                        minimum: 0
                        maximum: 99
                      playerResults:
                        type: array
                        maxItems: 4
                        items:
                          type: object
                          properties:
                            playerName:
                              type: string
                            kills:
                              type: integer
                      entryNotes:
                        type: string
                        maxLength: 500
                replaceExisting:
                  type: boolean
                  default: false
                validateConstraints:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Bulk results created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkOperationResponse"
        "207":
          description: Partial success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkOperationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT Results]
      summary: Update multiple results in bulk (up to 25)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
