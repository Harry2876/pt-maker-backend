  # ══════════════════════════════════════════════════════════
  # TIE-BREAKING (MATCH)
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/conflicts/detect:
    post:
      tags: [Quick-PT Tie-Breaking]
      summary: Detect points conflicts in match results
      description: "Identifies teams with identical total points that require tie-breaking resolution."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                forceRefresh:
                  type: boolean
                  default: false
                  description: "Bypass cache and re-detect from current results"
                includeResolved:
                  type: boolean
                  default: false
                  description: "Include already-resolved conflict groups in response"
      responses:
        "200":
          description: Conflict detection complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Conflicts detected successfully"
                  data:
                    $ref: "#/components/schemas/ConflictDetectionResult"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/conflicts/resolve:
    post:
      tags: [Quick-PT Tie-Breaking]
      summary: Resolve a points conflict manually
      description: "Provide a user-defined ordering for the tied teams."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conflictGroupId, userDefinedOrder]
              properties:
                conflictGroupId:
                  type: string
                  format: uuid
                  description: "ID of the conflict group returned by /conflicts/detect"
                userDefinedOrder:
                  type: array
                  minItems: 2
                  description: "Result IDs (UUIDs) in the preferred rank order (first = higher rank)"
                  items:
                    type: string
                    format: uuid
                reason:
                  type: string
                  maxLength: 500
                  example: "Team Alpha had better individual match consistency"
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Conflict resolved successfully"
                  data:
                    type: object
                    properties:
                      resolved:
                        type: boolean
                        example: true
                      conflictGroupId:
                        type: string
                        format: uuid
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/tie-breaking/rules:
    post:
      tags: [Quick-PT Tie-Breaking]
      summary: Set tie-breaking rules for a match
      description: |
        Configure ordered rules for automatic conflict resolution.

        **Rule methods:**
        - `KILLS` — higher total kills wins
        - `BEST_POSITION` — better (lower) best-position across matches wins
        - `MANUAL_ORDER` — defer to manual resolution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TieBreakingRulesBody"
      responses:
        "200":
          description: Tie-breaking rules saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tie-breaking rules set successfully"
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/tie-breaking/config:
    get:
      tags: [Quick-PT Tie-Breaking]
      summary: Get tie-breaking config for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Config retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Tie-breaking config retrieved"
                  data:
                    $ref: "#/components/schemas/TieBreakingConfig"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
