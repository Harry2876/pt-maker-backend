  /quick-pt/health:
    get:
      tags: [Quick-PT System]
      summary: Quick PT system health check
      description: |
        Checks: Python AI API, database, Cloudflare R2 storage, background job queue, system resources.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Health status retrieved successfully"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [healthy, degraded, unhealthy]
                        example: "healthy"
                      message:
                        type: string
                        example: "All systems operational"
                      timestamp:
                        type: string
                        format: date-time
                      services:
                        type: object
                        properties:
                          aiProcessing:
                            type: object
                            properties:
                              status:
                                type: string
                                enum: [up, down, limited]
                              responseTime:
                                type: number
                                example: 250.5
                              queueLength:
                                type: integer
                                example: 2
                          database:
                            type: object
                            properties:
                              status:
                                type: string
                                enum: [up, down]
                              responseTime:
                                type: number
                                example: 45.2
                          storage:
                            type: object
                            properties:
                              status:
                                type: string
                                enum: [up, down]
                              responseTime:
                                type: number
                              uploadsToday:
                                type: integer
                                example: 48
                          backgroundJobs:
                            type: object
                            properties:
                              status:
                                type: string
                                enum: [up, down]
                              activeWorkers:
                                type: integer
                                example: 3
                              pendingJobs:
                                type: integer
                                example: 1
                      systemMetrics:
                        type: object
                        properties:
                          uptime:
                            type: number
                            example: 86400
                          memoryUsage:
                            type: object
                            properties:
                              used:
                                type: number
                                example: 512.5
                              total:
                                type: number
                                example: 2048
                              percentage:
                                type: number
                                example: 25.02
                          cpuUsage:
                            type: number
                            example: 15.6
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          description: System unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "System is unhealthy"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "unhealthy"
                      errors:
                        type: array
                        items:
                          type: string
                        example: ["AI service unavailable"]
                  meta:
                    $ref: "#/components/schemas/MetaObject"

  /quick-pt/templates:
    get:
      tags: [Quick-PT System]
      summary: Get all available template images
      description: |
        Templates organized by format: 16_teams, 24_teams, 32_teams.
        Cached (10-min TTL). Returned with signed URLs (30-min expiry).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Templates retrieved successfully"
                  data:
                    type: object
                    properties:
                      templates:
                        type: object
                        properties:
                          16_teams:
                            type: array
                            items:
                              $ref: "#/components/schemas/TemplateInfo"
                          24_teams:
                            type: array
                            items:
                              $ref: "#/components/schemas/TemplateInfo"
                          32_teams:
                            type: array
                            items:
                              $ref: "#/components/schemas/TemplateInfo"
                      totalTemplates:
                        type: integer
                        example: 15
                      cacheExpiry:
                        type: integer
                        example: 1733323200000
                        description: "Unix timestamp when cache expires"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

# LOCAL SCHEMAS AND PARAMETERS

components:
  parameters:
    MatchId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: "Quick Match ID"
      example: "clx123abc456"

    SeriesId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: "Tournament Series ID"
      example: "series_clx123abc456"

  schemas:

    QuickMatchBasic:
      type: object
      properties:
        id:
          type: string
          example: "clx123abc456"
        matchName:
          type: string
          example: "BGMI Scrims Day 1"
        game:
          type: string
          example: "BGMI"
        map:
          type: string
          example: "Erangel"
        status:
          type: string
          enum: [CREATED, SLOTS_UPLOADED, ATTENDANCE_UPLOADED, RESULTS_UPLOADED, PROCESSING, COMPLETED, ERROR]
          example: "COMPLETED"
        teamsDetected:
          type: integer
          example: 16
        warningsCount:
          type: integer
          example: 2
        positionPointsConfig:
          type: array
          items:
            type: integer
          example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
        killPointsValue:
          type: integer
          example: 1
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuickMatchFull:
      allOf:
        - $ref: "#/components/schemas/QuickMatchBasic"
        - type: object
          properties:
            processingStep:
              type: string
              example: "Waiting for screenshots"
            scoringDescription:
              type: string
              example: "Standard BGMI scoring"

    SlotObject:
      type: object
      properties:
        id:
          type: string
        slotNumber:
          type: integer
          example: 1
        teamName:
          type: string
          example: "Team Alpha"
        playerNames:
          type: array
          items:
            type: string
          example: ["Player1", "Player2", "Player3", "Player4"]
        status:
          type: string
          enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
          example: "MATCHED"
        detectedInAttendance:
          type: boolean
          example: true
        matchQuality:
          type: number
          description: "Match confidence 0-100"
          example: 95.5
        quickMatchId:
          type: string
        createdAt:
          type: string
          format: date-time

    ScreenshotObject:
      type: object
      properties:
        id:
          type: string
        r2Key:
          type: string
          example: "quick-pt/clx123/attendance_1733312400.png"
        r2Url:
          type: string
        type:
          type: string
          enum: [ATTENDANCE, RESULT]
        pageNumber:
          type: integer
          nullable: true
        isProcessed:
          type: boolean
          example: false
        processingError:
          type: string
          nullable: true
        quickMatchId:
          type: string
        uploadedAt:
          type: string
          format: date-time

    MatchResultItem:
      type: object
      properties:
        id:
          type: string
          example: "result_abc123"
        slotNumber:
          type: integer
          example: 1
        teamName:
          type: string
          example: "Team Alpha"
        position:
          type: integer
          example: 1
        kills:
          type: integer
          example: 12
        positionPoints:
          type: integer
          example: 15
        killPoints:
          type: integer
          example: 12
        totalPoints:
          type: integer
          example: 27
        source:
          type: string
          enum: [MANUAL_ENTRY, AI_PROCESSED]
          example: "AI_PROCESSED"
        playerResults:
          type: array
          items:
            type: object
            properties:
              playerName:
                type: string
                example: "Player1"
              kills:
                type: integer
                example: 5
        matchQuality:
          type: number
          example: 95.5
        quickMatchId:
          type: string
        createdAt:
          type: string
          format: date-time

    PointsTableObject:
      type: object
      properties:
        id:
          type: string
        r2Key:
          type: string
        r2Url:
          type: string
        template:
          type: string
          example: "24_teams/template1"
        tableData:
          type: array
          items:
            type: object
            properties:
              rank:
                type: integer
                example: 1
              teamName:
                type: string
                example: "Team Alpha"
              slotNumber:
                type: integer
              position:
                type: integer
              kills:
                type: integer
              positionPoints:
                type: integer
              killPoints:
                type: integer
              totalPoints:
                type: integer
        quickMatchId:
          type: string
        createdAt:
          type: string
          format: date-time

    SeriesObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seriesName:
          type: string
          example: "BGMI Championship Series"
        game:
          type: string
          example: "BGMI"
        totalMatches:
          type: integer
          example: 5
        matchesCompleted:
          type: integer
          example: 3
        status:
          type: string
          enum: [CREATED, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "IN_PROGRESS"
        positionPointsConfig:
          type: array
          items:
            type: integer
          example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
        killPointsValue:
          type: integer
          example: 1
        scoringDescription:
          type: string
        currentMatchNumber:
          type: integer
          example: 4
        isFinished:
          type: boolean
          example: false
        winnerTeamName:
          type: string
          nullable: true
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CropObject:
      type: object
      properties:
        id:
          type: string
        cropType:
          type: string
          example: "attendance"
        signedUrl:
          type: string
          format: uri
          description: "Valid for 30 minutes"
        expiresAt:
          type: string
          format: date-time
        cropMetadata:
          type: object

    CropDownloadObject:
      allOf:
        - $ref: "#/components/schemas/CropObject"
        - type: object
          properties:
            downloadUrl:
              type: string
              format: uri
            filename:
              type: string
              example: "attendance_crop123.jpg"

    TemplateInfo:
      type: object
      properties:
        name:
          type: string
          example: "template1"
        signedUrl:
          type: string
        previewUrl:
          type: string
        category:
          type: string
          example: "24_teams"
        fullPath:
          type: string
          example: "24_teams/template1"

    TieBreakingRulesBody:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [type, priority]
            properties:
              type:
                type: string
                enum: [KILL_POINTS, PLACEMENT_POINTS, TOTAL_POINTS, CUSTOM_FIELD, MANUAL]
              priority:
                type: integer
                minimum: 1
                maximum: 10
              ascending:
                type: boolean
                default: false
              fieldName:
                type: string
              description:
                type: string
        autoResolveEnabled:
          type: boolean
          default: true

    TieBreakingConfig:
      type: object
      properties:
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
          enum: [match, series]
        rules:
          type: array
          items:
            type: object
        autoResolveEnabled:
          type: boolean

    BulkOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            success:
              type: boolean
            created:
              type: array
              items:
                type: object
            updated:
              type: array
              items:
                type: object
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            summary:
              type: object
              properties:
                total:
                  type: integer
                  example: 16
                successful:
                  type: integer
                  example: 16
                failed:
                  type: integer
                  example: 0
        meta:
          $ref: "#/components/schemas/MetaObject"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3

    SuccessNoData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        meta:
          $ref: "#/components/schemas/MetaObject"

    ErrorBody:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          $ref: "#/components/schemas/ErrorObject"
        meta:
          $ref: "#/components/schemas/MetaObject"