  # ══════════════════════════════════════════════════════════
  # EXPORT
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/export:
    post:
      tags: [Quick-PT Graphics]
      summary: Generate standings table image (Python AI)
      description: |
        Generates a professional tournament standings PNG using the Python AI image service.
        Returns a **signed Cloudflare R2 URL valid for 30 minutes**.

        ### How it works internally
        1. Node.js loads match results from the DB and ranks them.
        2. Node.js resolves `template` + `formatType` via `GET /quick-pt/templates`:
           - **template_url** → raw R2 URL of the template image (e.g. `.../templates/16_teams/tmplate_1.jpeg`)
           - **template_config_url** → paired config JSON (e.g. `.../templates/16_teams/templateConfig_1.json` for `tmplate_1`)
        3. Node builds the Python `POST /api/v1/standings/generate` body (snake_case) and forwards it.
        4. Python AI renders the image, uploads it to R2, and returns the raw R2 URL.
        5. Node.js signs the URL and returns it to the client.

        See `components.schemas.PythonStandingsGenerateRequest` for the exact Python payload shape.

        > The client never talks to Python AI directly. Node.js is the only entry point.

        ### Step-by-step for integrators
        1. **Get templates:** `GET /quick-pt/templates` → note the `name` and category key.
        2. **Choose template:** e.g. `name = "tmplate_2"`, category = `"16_teams"`.
        3. **POST here** with `{ "template": "tmplate_2", "formatType": "16_teams" }`.
        4. **Receive** `data.images` — array of signed URLs (30 min expiry). Use `data.signedImageUrl` for the first image only.
        5. **Re-export** any time to regenerate (overwrites the previous record).

        ### Split export (more teams than template capacity)
        If a match has more teams than the chosen format holds (e.g. **18 teams** with `16_teams`),
        Node automatically generates **multiple PNGs**:
        - **Part 1 (`main`)** — first 16 teams by rank
        - **Part 2 (`overflow`)** — remaining teams (e.g. ranks 17–18)

        Check `data.imageCount > 1` and render every entry in `data.images`.
        Filenames use `_part1`, `_overflow` suffixes when `outputFilename` is provided.

        > Team standings data is **not** duplicated in this response — use `GET /matches/{id}/results` for raw scores.

        > **Field name note:** The body field is `template`, not `templateName`.

        ### Appearance customization
        All fields after `formatType` are optional. Use top-level `eventName`, `organiserName`, and
        `sponsorName` to set header overlay text. Use `elementOverrides` to change font size/colour of
        those labels and `columnOverrides` to tweak individual column colours or weights.
        Use `advancedConfig` for pixel-level position overrides (see request schema).

        ### Prerequisites
        - Match must have at least one result (`POST /process`, or manual entry via `POST /results/manual` / `POST /results/bulk`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
            example:
              template: "tmplate_2"
              formatType: "16_teams"
              outputFilename: "scrims_day1_standings.png"
              eventName: "OVERALL STANDINGS"
              organiserName: "Scrymz Esports"
              sponsorName: "Sponsored by XYZ"
              tableFontSize: 75
              tableHeaderFontSize: 65
              tableHeaderLabelMode: "compact"
              tableHeaderColumnPadding: 12
              rowHeightAdjust: -30
              teamLogoSize: 155
              teamLogoSizeAdjust: 0
              teamLogoGap: 4
              teamShiftRight: 80
              chickenDinnerIconSize: 140
              chickenIconGap: 8
              elementOverrides:
                event_name: { size: 85, color: "#FFFFFF" }
                sponsor_name: { size: 55, color: "#FFD700" }
                organiser_name: { size: 65, color: "#FFFFFF" }
              columnOverrides:
                rank: { color: "#E0E0E0" }
                team_name: { color: "#FFB74D", weight: "bold" }
                matches: { color: "#E0E0E0" }
                position: { color: "#87CEEB" }
                kills: { color: "#FF6B6B" }
                total: { color: "#FFD700", weight: "bold" }
              fontCustomization:
                header_font: { font_file: "built_titling_bd.ttf" }
                sponsor_font: { font_file: "agency.ttf", color: "#FFD700" }
                organiser_font: { font_file: "california.otf", color: "#FFFFFF" }
                table_header_font: { font_file: "akira_expanded.otf" }
                table_data_font: { font_file: "coolvetica_rg.ttf" }
                team_name_font: { font_file: "roboto_condensed_black.ttf", color: "#FFB74D" }
                footer_font: { font_file: "coolvetica_rg.ttf" }
                global_size_multiplier: 1.0
              advancedConfig:
                header:
                  event_name: { text: "FINALS DAY 2", enabled: true }
              showBranding: true
              options:
                uploadToR2: true
                compressImage: false
                imageQuality: 95
                renderScale: null
      responses:
        "200":
          description: Standings image generated and uploaded to R2
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Standings table exported successfully"
                  data:
                    $ref: "#/components/schemas/ExportResponse"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          description: "No results found or template not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

