          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/export/excel:
    get:
      tags: [Quick-PT Export]
      summary: Export match results to Excel
      description: |
        Generate Excel report with sheets: Match Summary, Final Standings, Detailed Results,
        Points Breakdown (optional), Player Statistics (optional).
        Returns signed download URL valid for 30 minutes. File auto-deleted after 1 hour.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: includePlayerDetails
          schema:
            type: boolean
            default: false
        - in: query
          name: includePointsBreakdown
          schema:
            type: boolean
            default: true
        - in: query
          name: customFilename
          schema:
            type: string
            maxLength: 100
          example: "BGMI_Tournament_Finals"
      responses:
        "200":
          description: Excel exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Excel export completed successfully"
                  data:
                    type: object
                    properties:
                      downloadUrl:
                        type: string
                        format: uri
                        description: "Signed download URL — expires in 30 minutes"
                      filename:
                        type: string
                        example: "BGMI_Match_2026-02-10.xlsx"
                      expiresAt:
                        type: string
                        format: date-time
                      generationTimeMs:
                        type: integer
                        example: 1250
                      sheetsGenerated:
                        type: integer
                        example: 4
                      totalRows:
                        type: integer
                        example: 156
                      fileSize:
                        type: integer
                        example: 45678
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
