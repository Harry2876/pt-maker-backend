# Quick PT Module — docs/paths/quickPT.yaml
# Base: /api/v1/quick-pt
# All routes require: Authorization: Bearer <token>
#
# Quick Series: scoring lives on each Quick Match (positionPointsConfig, killPointsValue).
# A series only groups matches and sums their computed totalPoints — no series-level scoring config.

paths:

  # ══════════════════════════════════════════════════════════
  # QUICK MATCHES
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches:
    post:
      tags: [Quick-PT]
      summary: Create a Quick Match
      description: |
        Creates a Quick Match with a custom scoring configuration.
        This is always **Step 1** of the Quick PT flow.

        **Complete flow (all steps):**
        1. **Create match** ← you are here
        2. *(Optional)* `POST /slots/parse` — pre-set team names by slot number
        3. `POST /screenshots?type=ATTENDANCE` — upload attendance images (≤ 3)
        4. `POST /screenshots?type=RESULT` — upload result images (≤ 9)
        5. `POST /process` with `{ "type": "ATTENDANCE" }` — OCR attendance
        6. `POST /process` with `{ "type": "RESULT" }` — OCR results + calculate points
        7. `GET /results` — verify final standings
        8. `GET /templates` → `POST /export` — generate standings PNG
        9. Receive `signedImageUrl` — valid 30 minutes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchName]
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "BGMI Scrims Day 1"
                game:
                  type: string
                  default: "BGMI"
                  example: "BGMI"
                map:
                  type: string
                  example: "Erangel"
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                  description: "10 integers — points for positions 1 through 10"
                  example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
                killPointsValue:
                  type: integer
                  minimum: 0
                  default: 1
                  example: 1
                scoringDescription:
                  type: string
                  maxLength: 200
                  example: "Standard BGMI scoring"
      responses:
        "201":
          description: Quick Match created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match created successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT]
      summary: List all Quick Matches for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, ERROR]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matches retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Matches retrieved successfully"
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuickMatchBasic"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}:
    get:
      tags: [Quick-PT]
      summary: Get Quick Match by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT]
      summary: Update Quick Match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                map:
                  type: string
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                killPointsValue:
                  type: integer
                  minimum: 0
                scoringDescription:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match updated successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT]
      summary: Delete Quick Match
      description: "Permanently deletes the match and all related data — slots, screenshots, results, points tables."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # SLOTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/slots/parse:
    post:
      tags: [Quick-PT Slots]
      summary: Parse and create slots from plain text
      description: |
        Parse a multi-line text block into slot assignments in one call.

        **Supported formats:**
        - `Slot 1 - Team Alpha`
        - `1. Team Alpha`
        - `Slot 1: Team Alpha`
        - `Slot 1 Team Alpha`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotsText]
              properties:
                slotsText:
                  type: string
                  example: "Slot 1: Team Alpha\nSlot 2: Team Beta\nSlot 3: Team Gamma"
      responses:
        "201":
          description: Slots parsed and created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots created successfully"
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          $ref: "#/components/schemas/SlotObject"
                      errors:
                        type: array
                        items:
                          type: string
                        example: ["Line 5: Invalid format"]
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/slots:
