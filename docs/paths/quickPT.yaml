        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # AI PROCESSING
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/process:
    post:
      tags: [Quick-PT Processing]
      summary: Process match screenshots with Python AI
      description: |
        Unified endpoint for all screenshot processing steps. Forwards uploaded screenshots
        to the Python AI service and writes the extracted data back to the database.

        ### Processing types

        | `type` | Description |
        |---|---|
        | `ATTENDANCE` | Sends attendance screenshots to Python AI OCR. Detects slot numbers and full player rosters. Creates slot records in the DB with `playerNames` stored for later matching. |
        | `RESULT` | Sends result screenshots to Python AI OCR. Extracts team rankings and kill counts. Matches result teams to attendance slots using **fuzzy roster comparison** (see below). Calculates points. Writes results to DB. |
        | `COMPLETE` *(default)* | Runs `ATTENDANCE` then `RESULT` sequentially in one request. |

        ### Image types
        - **Attendance screenshots** (`expanded_layout`) — taken before the match. Each image shows
          ~6 teams with their slot numbers and full player lists.
        - **Result screenshots** (`compact_layout`) — taken after the match ends. Each image shows
          ~2–3 teams with their final rank and per-player kill count.

        Python AI auto-detects layout type from the screenshot — no need to specify.

        ### Roster-based team matching (RESULT step)
        Because OCR can vary between image types, teams are matched by comparing **all player names**
        across the result screenshot against the player names stored during the attendance step.
        The algorithm uses fuzzy name matching (normalisation, prefix, Levenshtein, bigram similarity).
        **At least 3 of 4 roster players must match** for a slot assignment (stricter for smaller rosters).

        Result OCR runs **per screenshot** (`ocrMode: per_image`) to avoid scroll-header rank collisions
        that corrupt kill totals in batch mode. Duplicate rank-1/2 headers across scroll pages are
        deduped and reported as `DUPLICATE_TEAM` warnings.

        ### Per-player finishes in the response
        Each saved team includes **`playerResults`** — individual player names and kill counts as
        detected by OCR. The full persisted rows are also returned in **`results`** (same shape as
        `GET /quick-pt/matches/{id}/results`).

        ### Prerequisites
        - Screenshots must be uploaded before processing (`POST /quick-pt/matches/{id}/screenshots`).
        - Attendance must be processed before results — slot records must exist for team matching.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [ATTENDANCE, RESULT, COMPLETE]
                  default: COMPLETE
                  description: "Which processing step to run"
                  example: "ATTENDANCE"
      responses:
        "200":
          description: Processing completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Attendance processed successfully"
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/AttendanceProcessingResult"
                      - $ref: "#/components/schemas/ResultProcessingResult"
                      - $ref: "#/components/schemas/CompleteProcessingResult"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
              examples:
                attendance:
                  summary: ATTENDANCE response
                  value:
                    success: true
                    message: "Attendance processed successfully"
                    data:
                      success: true
                      slotsDetected: 19
                      slotsCreated: 19
                      warnings: []
                      processingTimeMs: 20140
                      confidence:
                        overall: 1
                        slotExtraction: 1
                      audit:
                        ocrMode: batch
                        imagesProcessed: 3
                        rawTeams: 19
                        mergedSlots: 19
                        reconciliationWarnings: 0
                    meta:
                      timestamp: "2026-06-13T18:00:51.365Z"
                      version: "1.0"
                result:
                  summary: RESULT response (excerpt — rank 1 team)
                  value:
                    success: true
                    message: "Results processed successfully"
                    data:
                      success: true
                      resultsCreated: 19
                      resultsProcessed: 19
                      warnings:
