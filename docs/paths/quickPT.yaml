                            type: integer
                            minimum: 1
                            maximum: 25
                          rank:
                            type: integer
                            minimum: 1
                            maximum: 25
                          totalKills:
                            type: integer
                            minimum: 0
                            maximum: 99
                          playerResults:
                            type: array
                            maxItems: 4
                            items:
