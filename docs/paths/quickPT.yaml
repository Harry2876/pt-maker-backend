    # ── Templates ────────────────────────────────────────────

    TemplateInfo:
      type: object
      description: |
        One PT template image. Config JSON is auto-paired: `tmplate_1` → `templateConfig_1.json`.
      properties:
        name:
          type: string
          description: "Template identifier — pass as `template` in export request"
          example: "tmplate_1"
        signedUrl:
          type: string
          format: uri
          description: "Signed URL for app preview (30 min)"
        previewUrl:
          type: string
          format: uri
          nullable: true
        configUrl:
          type: string
          format: uri
          description: "Signed URL of paired templateConfig_N.json (30 min)"
        rawTemplateUrl:
          type: string
          format: uri
          description: "Raw R2 URL — Node sends to Python as template_url"
        rawConfigUrl:
          type: string
          format: uri
          description: "Raw R2 URL — Node sends to Python as template_config_url"
        category:
          type: string
          description: "Format category — pass as formatType in export"
          example: "16_teams"
        fullPath:
          type: string
          example: "16_teams/tmplate_1"
        originalExtension:
          type: string
          example: "jpeg"

    # ── Tie-Breaking ─────────────────────────────────────────

    TieBreakingRulesBody:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 5
          description: "Ordered list of tie-breaking rules. Rules are applied by priority (lowest number first)."
          items:
            type: object
            required: [method, priority]
            properties:
              method:
                type: string
                enum: [KILLS, BEST_POSITION, MANUAL_ORDER]
                description: |
                  - `KILLS` — team with more total kills ranks higher
                  - `BEST_POSITION` — team with a better (lower) best finish ranks higher
                  - `MANUAL_ORDER` — no automatic resolution; requires manual conflict resolution
              priority:
                type: integer
                minimum: 1
                maximum: 10
                description: "Apply order (1 = highest priority)"
              isActive:
                type: boolean
                default: true
              description:
                type: string
                maxLength: 200
        autoResolveEnabled:
          type: boolean
          default: true
          description: "If false, conflicts are flagged but not resolved automatically"

    TieBreakingConfig:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
          nullable: true
        seriesId:
          type: string
          format: uuid
          nullable: true
        rules:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
                enum: [KILLS, BEST_POSITION, MANUAL_ORDER]
              priority:
                type: integer
              isActive:
                type: boolean
              description:
                type: string
                nullable: true
        manualResolutions:
          type: array
          items:
            type: object
            properties:
              conflictGroupId:
                type: string
              points:
                type: number
              userDefinedOrder:
                type: array
                items:
                  type: string
              resolvedBy:
                type: string
              resolvedAt:
                type: string
                format: date-time
              reason:
                type: string
                nullable: true
        autoResolveEnabled:
          type: boolean

    ConflictDetectionResult:
      type: object
      properties:
        hasConflicts:
          type: boolean
          example: true
        conflictGroups:
          type: array
          items:
            type: object
            properties:
              points:
                type: number
                description: "The tied points value"
                example: 27
              conflictType:
                type: string
                enum: [TOTAL_POINTS, POSITION_POINTS, SERIES_POINTS]
                example: "TOTAL_POINTS"
              requiresManualResolution:
                type: boolean
                example: false
              conflictedTeams:
                type: array
                items:
                  type: string
                description: |
                  Team names in this conflict group (match conflicts may also include full result objects
                  in legacy responses — prefer `conflictedTeamNames` for series).
                example: ["Team Alpha", "Team Beta"]
              conflictedTeamNames:
                type: array
                items:
                  type: string
                description: "Team names tied on the same points value (series conflicts)"
                example: ["TEAM ALPHA", "TEAM BRAVO"]
              conflictedStandings:
                type: array
                description: "Full aggregated series standings for each tied team (series conflicts only)"
                items:
                  $ref: "#/components/schemas/SeriesTeamStanding"
        totalConflictedTeams:
          type: integer
          example: 4
        autoResolvableCount:
          type: integer
          description: "Conflicts that can be resolved by configured rules"
          example: 2
        manualResolutionRequired:
          type: integer
          description: "Conflicts that require manual ordering"
          example: 0

    # ── Bulk operations ──────────────────────────────────────

    BulkOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
