  /quick-pt/matches/{id}/export:
    post:
      tags: [Quick-PT Export]
      summary: Generate standings table image
      description: |
        Calls the Python AI service to render a professional standings table image.
        Returns a signed URL valid for 30 minutes.

        **Available templates:** `16_teams/template1`, `24_teams/template1`, `24_teams/template2`, `32_teams/template1`

        **Prerequisites:** Match must have results.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  example: "24_teams/template1"
                formatType:
                  type: string
                  enum: [16_teams, 24_teams, 32_teams]
                  example: "24_teams"
                outputFilename:
                  type: string
                  example: "tournament_standings.png"
      responses:
        "200":
          description: Standings table generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Standings table exported successfully"
                  data:
                    type: object
                    properties:
                      pointsTableId:
                        type: string
                        format: uuid
                      signedImageUrl:
                        type: string
                        format: uri
                        description: "Signed URL valid for 30 minutes"
                      originalImageUrl:
                        type: string
                        format: uri
                        description: "Permanent R2 URL (unsigned)"
                      templateUsed:
                        type: string
                        example: "24_teams/template1"
                      formatType:
                        type: string
                        example: "24_teams"
                      teamsProcessed:
                        type: integer
                        example: 24
                      quickMatchId:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/export/excel:
    get:
      tags: [Quick-PT Export]
      summary: Export match results to Excel
      description: |
        Generates an Excel workbook with multiple sheets:
        - **Match Summary** — metadata and scoring config
        - **Final Standings** — ranked results
        - **Detailed Results** — per-team breakdown
        - **Points Breakdown** *(optional)* — position + kill points per team
        - **Player Statistics** *(optional)* — per-player kill data

        Returns a signed download URL valid for 30 minutes. File is auto-deleted after 1 hour.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: includePlayerDetails
          schema:
            type: boolean
            default: false
        - in: query
          name: includePointsBreakdown
          schema:
            type: boolean
            default: true
        - in: query
          name: customFilename
          schema:
            type: string
            maxLength: 100
          example: "BGMI_Tournament_Finals"
      responses:
        "200":
          description: Excel exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Excel export completed successfully"
                  data:
                    type: object
                    properties:
                      downloadUrl:
                        type: string
                        format: uri
                        description: "Signed download URL — expires in 30 minutes"
                      filename:
                        type: string
                        example: "BGMI_Match_2026-02-10.xlsx"
                      expiresAt:
                        type: string
                        format: date-time
                      generationTimeMs:
                        type: integer
                        example: 1250
                      sheetsGenerated:
                        type: integer
                        example: 4
                      totalRows:
                        type: integer
                        example: 156
                      fileSize:
                        type: integer
                        description: "File size in bytes"
                        example: 45678
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

