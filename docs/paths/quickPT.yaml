# Quick PT Module — docs/paths/quickPT.yaml
# Base: /api/v1/quick-pt
# All routes require: Authorization: Bearer <token>

paths:

  # ══════════════════════════════════════════════════════════
  # QUICK MATCHES
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches:
    post:
      tags: [Quick-PT]
      summary: Create a Quick Match
      description: |
        Creates a Quick Match with custom scoring configuration.

        **Typical workflow:**
        1. Create match → 2. Upload slots (text parse or manual) → 3. Upload screenshots
        → 4. Process with AI (`/process/attendance` then `/process/results`)
        → 5. Export points table (`/export`)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchName]
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: "BGMI Scrims Day 1"
                game:
                  type: string
                  default: "BGMI"
                  example: "BGMI"
                map:
                  type: string
                  example: "Erangel"
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                  description: "10 integers — points for positions 1 through 10"
                  example: [15, 12, 10, 8, 6, 4, 2, 1, 0, 0]
                killPointsValue:
                  type: integer
                  minimum: 0
                  default: 1
                  example: 1
                scoringDescription:
                  type: string
                  maxLength: 200
                  example: "Standard BGMI scoring"
      responses:
        "201":
          description: Quick Match created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match created successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT]
      summary: List all Quick Matches for current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, ERROR]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Matches retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Matches retrieved successfully"
                  data:
                    type: object
                    properties:
                      matches:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuickMatchBasic"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}:
    get:
      tags: [Quick-PT]
      summary: Get Quick Match by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match retrieved successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT]
      summary: Update Quick Match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchName:
                  type: string
                  minLength: 3
                  maxLength: 100
                map:
                  type: string
                positionPointsConfig:
                  type: array
                  minItems: 10
                  maxItems: 10
                  items:
                    type: integer
                    minimum: 0
                killPointsValue:
                  type: integer
                  minimum: 0
                scoringDescription:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quick Match updated successfully"
                  data:
                    $ref: "#/components/schemas/QuickMatchFull"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT]
      summary: Delete Quick Match
      description: "Permanently deletes the match and all related data — slots, screenshots, results, points tables."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # SLOTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/slots/parse:
    post:
      tags: [Quick-PT Slots]
      summary: Parse and create slots from plain text
      description: |
        Parse a multi-line text block into slot assignments in one call.

        **Supported formats:**
        - `Slot 1 - Team Alpha`
        - `1. Team Alpha`
        - `Slot 1: Team Alpha`
        - `Slot 1 Team Alpha`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotsText]
              properties:
                slotsText:
                  type: string
                  example: "Slot 1: Team Alpha\nSlot 2: Team Beta\nSlot 3: Team Gamma"
      responses:
        "201":
          description: Slots parsed and created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots created successfully"
                  data:
                    type: object
                    properties:
                      created:
                        type: array
                        items:
                          $ref: "#/components/schemas/SlotObject"
                      errors:
                        type: array
                        items:
                          type: string
                        example: ["Line 5: Invalid format"]
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/slots:
    post:
      tags: [Quick-PT Slots]
      summary: Create a single slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                playerNames:
                  type: array
                  items:
                    type: string
                  example: ["Player1", "Player2", "Player3", "Player4"]
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot created successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Slots]
      summary: List all slots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
        - in: query
          name: detectedInAttendance
          schema:
            type: boolean
      responses:
        "200":
          description: Slots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Quick-PT Slots]
      summary: Delete all slots for a match
      description: "Remove all slot assignments. Useful before re-uploading corrected slots."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: All slots deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All slots deleted successfully"
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/slots/{slotId}:
    put:
      tags: [Quick-PT Slots]
      summary: Update a slot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slotId
          required: true
          schema:
            type: string
            format: uuid
          description: "Slot ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  format: uuid
                  example: "clx123abc456"
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 5
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha Updated"
                playerNames:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [PENDING, DETECTED, MATCHED, NOT_FOUND]
                detectedInAttendance:
                  type: boolean
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot updated successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # SCREENSHOTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/screenshots:
    post:
      tags: [Quick-PT Screenshots]
      summary: Upload screenshots
      description: |
        Upload attendance or result screenshots to Cloudflare R2.

        - Pass screenshot type via query param: `?type=ATTENDANCE` or `?type=RESULT`
        - Max 10 files per request, 10 MB each
        - Supported formats: PNG, JPG, JPEG, WebP
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
          example: "ATTENDANCE"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                pageNumber:
                  type: integer
                  minimum: 1
                  maximum: 20
      responses:
        "201":
          description: Screenshots uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      uploaded:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScreenshotObject"
                      errors:
                        type: array
                        items:
                          type: string
                      uploadId:
                        type: string
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Screenshots]
      summary: List screenshots for a match
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - in: query
          name: type
          schema:
            type: string
            enum: [ATTENDANCE, RESULT]
        - in: query
          name: isProcessed
          schema:
            type: boolean
      responses:
        "200":
          description: Screenshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScreenshotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/screenshots/{screenshotId}:
    delete:
      tags: [Quick-PT Screenshots]
      summary: Delete a screenshot
      description: "Deletes screenshot record from database and the file from Cloudflare R2 storage."
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: screenshotId
          required: true
          schema:
            type: string
            format: uuid
          description: "Screenshot ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quickMatchId]
              properties:
                quickMatchId:
                  type: string
                  format: uuid
                  example: "clx123abc456"
                  description: "Required to verify ownership"
      responses:
        "200":
          description: Screenshot deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # AI PROCESSING
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/process/attendance:
    post:
      tags: [Quick-PT Processing]
      summary: Process attendance screenshots with AI
      description: |
        Sends uploaded attendance screenshots to the Python AI service for player/team detection.
        Detected teams are automatically created as slots (or update existing ones).

        **Prerequisites:** At least one ATTENDANCE screenshot must be uploaded first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Attendance processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Attendance processed successfully"
                  data:
                    type: object
                    properties:
                      slotsDetected:
                        type: integer
                        description: "Total unique slots detected across all screenshots"
                        example: 16
                      slotsCreated:
                        type: integer
                        description: "New slots created in database"
                        example: 14
                      warnings:
                        type: array
                        description: "Non-fatal issues encountered during processing"
                        items:
                          $ref: "#/components/schemas/ProcessingWarning"
                      processingTimeMs:
                        type: integer
                        description: "Total processing time in milliseconds"
                        example: 4250
                      confidence:
                        type: object
                        properties:
                          overall:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            description: "Fraction of screenshots processed successfully"
                            example: 0.95
                          slotExtraction:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            example: 0.95
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          description: "No attendance screenshots found or match not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/process/results:
    post:
      tags: [Quick-PT Processing]
      summary: Process result screenshots with AI
      description: |
        Sends uploaded result screenshots to the Python AI service for rank and kill extraction.
        Results are matched against existing slots and points are calculated automatically.

        **Prerequisites:** Attendance must be processed first (slots must exist).
        At least one RESULT screenshot must be uploaded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Results processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Results processed successfully"
                  data:
                    type: object
                    properties:
                      resultsCreated:
                        type: integer
                        description: "Number of result records successfully created"
                        example: 16
                      resultsProcessed:
                        type: integer
                        description: "Total unique results extracted from screenshots"
                        example: 16
                      warnings:
                        type: array
                        description: "Non-fatal issues — unmatched teams, low confidence, etc."
                        items:
                          $ref: "#/components/schemas/ProcessingWarning"
                      processingTimeMs:
                        type: integer
                        description: "Total processing time in milliseconds"
                        example: 6800
                      confidence:
                        type: object
                        properties:
                          overall:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            example: 0.88
                          resultExtraction:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 1
                            example: 0.88
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          description: "No result screenshots found or no teams detected yet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/process/complete:
    post:
      tags: [Quick-PT Processing]
      summary: Run full pipeline — attendance then results in sequence
      description: |
        Convenience endpoint that runs attendance processing followed by result processing in sequence.
        Match status is set to `COMPLETED` on success.

        **Prerequisites:** Both ATTENDANCE and RESULT screenshots must be uploaded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match processing completed successfully"
                  data:
                    type: object
                    properties:
                      attendanceResult:
                        type: object
                        description: "Output from attendance processing step"
                        properties:
                          slotsDetected:
                            type: integer
                            example: 16
                          slotsCreated:
                            type: integer
                            example: 16
                          warnings:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProcessingWarning"
                          processingTimeMs:
                            type: integer
                            example: 4200
                          confidence:
                            type: object
                            properties:
                              overall:
                                type: number
                                example: 1.0
                              slotExtraction:
                                type: number
                                example: 1.0
                      resultProcessingResult:
                        type: object
                        description: "Output from result processing step"
                        properties:
                          resultsCreated:
                            type: integer
                            example: 16
                          resultsProcessed:
                            type: integer
                            example: 16
                          warnings:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProcessingWarning"
                          processingTimeMs:
                            type: integer
                            example: 6800
                          confidence:
                            type: object
                            properties:
                              overall:
                                type: number
                                example: 0.88
                              resultExtraction:
                                type: number
                                example: 0.88
                      totalProcessingTimeMs:
                        type: integer
                        description: "Total wall-clock time for both steps combined"
                        example: 11000
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════════════════
  # RESULTS
  # ══════════════════════════════════════════════════════════

  /quick-pt/matches/{id}/results:
    get:
      tags: [Quick-PT Results]
      summary: Get all results for a match
      description: "Returns AI-processed or manually entered results sorted by position ascending."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Match results retrieved successfully"
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/MatchResultItem"
                      count:
                        type: integer
                        example: 16
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/results/manual:
    post:
      tags: [Quick-PT Results]
      summary: Create a manual result entry
      description: |
        Manually enter a team result without AI processing.
        Points are automatically calculated from the match's scoring configuration.
        Sets match status to `COMPLETED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName, position, rank, totalKills]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                position:
                  type: integer
                  minimum: 1
                  maximum: 25
                  example: 1
                rank:
                  type: integer
                  minimum: 1
                  maximum: 25
                  example: 1
                  description: "Same as position for standard matches"
                totalKills:
                  type: integer
                  minimum: 0
                  maximum: 99
                  example: 12
                playerResults:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [playerName, kills]
                    properties:
                      playerName:
                        type: string
                        example: "Player1"
                      kills:
                        type: integer
                        minimum: 0
                        example: 5
      responses:
        "201":
          description: Manual result created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Manual result created successfully"
                  data:
                    $ref: "#/components/schemas/MatchResultItem"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /quick-pt/matches/{id}/results/bulk:
    post:
      tags: [Quick-PT Results]
      summary: Create multiple results in bulk (up to 25)
      description: |
        Create up to 25 result records in a single request.
        Points are automatically calculated for each entry.
        Sets match status to `COMPLETED` if any results are created successfully.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [slotNumber, teamName, position, rank, totalKills]
                    properties:
                      slotNumber:
                        type: integer
                        minimum: 1
                        maximum: 100
                      teamName:
                        type: string
                        minLength: 2
                        maxLength: 50
                      position:
                        type: integer
                        minimum: 1
                        maximum: 25
                      rank:
                        type: integer
                        minimum: 1
                        maximum: 25
                      totalKills:
                        type: integer
                        minimum: 0
                        maximum: 99
                      playerResults:
                        type: array
                        maxItems: 4
                        items:
                          type: object
                          properties:
                            playerName:
                              type: string
                            kills:
                              type: integer
                              minimum: 0
                replaceExisting:
                  type: boolean
                  default: false
                  description: "If true, deletes all existing results before inserting"
                validateConstraints:
                  type: boolean
                  default: true
                  description: "If true, validates slot existence and position uniqueness before inserting"
      responses:
        "201":
          description: All results created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkOperationResponse"
        "207":
          description: "Partial success — some results created, some failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkOperationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Quick-PT Results]
      summary: Update multiple results in bulk (up to 25)
