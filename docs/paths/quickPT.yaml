  # EXPORT

  /quick-pt/matches/{id}/export:
    post:
      tags: [Quick-PT Export]
      summary: Export standings table image
      description: |
        Generate a professional standings table image. Returns a signed URL valid for 30 minutes.
        Template formats: 16_teams/template1, 24_teams/template1, 24_teams/template2, 32_teams/template1
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  example: "24_teams/template1"
                formatType:
                  type: string
                  example: "24_teams"
                outputFilename:
                  type: string
                  example: "tournament_standings.png"
      responses:
        "200":
          description: Standings table exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Standings table exported successfully"
                  data:
                    type: object
                    properties:
                      pointsTableId:
                        type: string
                      signedImageUrl:
                        type: string
                        description: "Signed URL valid for 30 minutes"
                      originalImageUrl:
                        type: string
                      templateUsed:
                        type: string
                        example: "24_teams/template1"
                      formatType:
                        type: string
                        example: "24_teams"
                      teamsProcessed:
                        type: integer
                        example: 24
                      quickMatchId:
                        type: string
                      createdAt:
                        type: string
