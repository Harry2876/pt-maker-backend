      summary: Create a single slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotNumber, teamName]
              properties:
                slotNumber:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                teamName:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Team Alpha"
                playerNames:
                  type: array
                  items:
                    type: string
                  example: ["Player1", "Player2", "Player3", "Player4"]
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Slot created successfully"
                  data:
                    $ref: "#/components/schemas/SlotObject"
                  meta:
                    $ref: "#/components/schemas/MetaObject"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

    get:
      tags: [Quick-PT Slots]
      summary: List all slots for a match
      security:
        - bearerAuth: []
      parameters:
