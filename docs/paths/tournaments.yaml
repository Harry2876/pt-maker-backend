        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/update/{id}:
    put:
      tags: [Groups]
      summary: Update group
      description: |
        **Exists on backend** — use in the app.

        Updates `name`, `maxTeams`, and/or `qualificationSpots` only.
        Does **not** accept `stageId` (stage link is fixed at create time).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/delete/{id}:
    delete:
      tags: [Groups]
      summary: Delete group
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
