    post:
      tags: [Team Advancement]
      summary: Complete stage progression (qualify + progress + slot assign + advance)
      description: |
        All-in-one endpoint that runs, in order:
        1. `qualifyTeamsFromStage`
        2. `progressTeamsToNextStage`
        3. Auto-assign slots in new groups
        4. `advanceStage` (mark current complete, activate next)
      security:
