    post:
      tags: [Team Advancement]
      summary: Progress qualified teams to next stage
      description: |
        Requires cached qualification results on `currentStageId` and pre-created groups on `nextStageId`.
        Distributes qualified teams into next-stage groups and updates team registrations.
        Result is cached at `stage:{currentStageId}:progression:result`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CurrentStageIdPath'
        - $ref: '#/components/parameters/NextStageIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamDistributionRequest'
            example:
              strategy: "SNAKE_DRAFT"
              preserveTopPerformers: true
              balanceByPoints: true
      responses:
        '200':
          description: Teams progressed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Teams progressed to next stage successfully"
