  # ════════════════════════════════════════════════════════════════════════════
  # TOURNAMENT UPLOADS — /uploads (tournament match screenshots only)
  # ════════════════════════════════════════════════════════════════════════════

  /uploads/matches/{id}/screenshots/upload:
    post:
      tags: [Tournament Uploads]
      summary: Upload tournament match screenshots (storage only)
      description: |
        Multipart upload for **core tournament** match screenshots. This is **not** Quick PT.

        ### Do not confuse with Quick PT (production)
        | | Tournament upload | Quick PT upload |
        |---|---|---|
        | **Endpoint** | `POST /uploads/matches/{id}/screenshots/upload` | `POST /quick-pt/matches/{id}/screenshots` |
        | **Match ID** | Tournament `Match` UUID (`/matches/...`) | Quick Match ID (`/quick-pt/matches/...`) |
        | **R2 folder** | `tournaments/{type}/match-{id}/...` | `quick-pt/{type}/match-{id}/...` |
        | **Database** | `screenshots` table | `quick_screenshots` table |
        | **AI / OCR** | **No** — files stored for reference only | **Yes** — attendance/result OCR pipeline |
        | **Results** | Enter manually via `/match-results` | Auto via `POST /quick-pt/matches/{id}/process` |

        **Required query param:** `type=ATTENDANCE_IMAGE` or `type=RESULT_IMAGE`

        Files are saved to Cloudflare R2 and linked to the tournament match. There is **no**
        automatic OCR or result extraction on this path. After upload, staff still enter results
        manually (create → verify → publish).

        **Shared upload lock:** Both systems use one per-user upload lock (`upload:active:{userId}`).
        A user cannot upload to tournament and Quick PT at the exact same moment (429 if concurrent).
        This does not affect normal Quick PT production usage when clients only call `/quick-pt/...`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchIdPath'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScreenshotType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
                  maxItems: 10
      responses:
        '201':
          description: Screenshots stored successfully (no AI processing queued)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      screenshots:
                        type: array
                        items:
                          type: object
                      uploadId:
                        type: string
                        format: uuid
                      count:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/MetaObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /uploads/matches/{id}/screenshots:
    get:
      tags: [Tournament Uploads]
      summary: List match screenshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchIdPath'
      responses:
        '200':
          description: Screenshots retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/MetaObject'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

