  # ════════════════════════════════════════════════════════════════════════════
  # TEAM ADVANCEMENT — /team-advancement
  # ════════════════════════════════════════════════════════════════════════════

  /team-advancement/stage/{stageId}/qualify:
    post:
      tags: [Team Advancement]
      summary: Qualify teams from stage
      description: |
        Runs qualification for every group in the stage using group leaderboards.
        Qualification method is `TOP_POINTS` with tie-breakers `TOTAL_KILLS` then `BEST_POSITION`.
        Result is cached at `stage:{stageId}:qualification:result` (TTL 5 min).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      responses:
        '200':
          description: Teams qualified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Teams qualified successfully"
                      data:
                        $ref: '#/components/schemas/StageQualificationResultObject'
              example:
                success: true
                message: "Teams qualified successfully"
                data:
                  stageId: "223e4567-e89b-12d3-a456-426614174001"
                  stageName: "Quarter Finals"
                  totalGroups: 2
                  totalTeamsStarted: 16
                  totalTeamsQualified: 8
                  groupResults:
                    - groupId: "323e4567-e89b-12d3-a456-426614174002"
                      groupName: "Group A"
                      totalTeams: 8
                      qualificationSpots: 4
                      qualifiedTeams:
                        - teamRegistrationId: "423e4567-e89b-12d3-a456-426614174003"
                          teamName: "Team Phoenix"
                          finalGroupPosition: 1
                          totalPoints: 87
                          totalKills: 42
                          fromGroupId: "323e4567-e89b-12d3-a456-426614174002"
                          fromGroupName: "Group A"
                          qualificationReason: "Qualified as #1 (Top 4)"
                      eliminatedTeams:
                        - teamRegistrationId: "523e4567-e89b-12d3-a456-426614174005"
                          teamName: "Team Delta"
                          finalGroupPosition: 5
                          totalPoints: 34
                          eliminationReason: "Eliminated at #5 (Only top 4 qualify)"
                  qualificationSummary:
                    teamsAdvanced: 8
                    teamsEliminated: 8
                    averagePointsToQualify: 72
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /team-advancement/stage/{stageId}/qualification-results:
    get:
      tags: [Team Advancement]
      summary: Get cached qualification results
      description: Reads the cached `StageQualificationResult` written by POST qualify. Returns 404 if qualify has not been run yet.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      responses:
        '200':
          description: Qualification results retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Qualification results retrieved successfully"
                      data:
                        $ref: '#/components/schemas/StageQualificationResultObject'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /team-advancement/progress/{currentStageId}/to/{nextStageId}:
    post:
      tags: [Team Advancement]
      summary: Progress qualified teams to next stage
      description: |
        Requires cached qualification results on `currentStageId` and pre-created groups on `nextStageId`.
        Distributes qualified teams into next-stage groups and updates team registrations.
        Result is cached at `stage:{currentStageId}:progression:result`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CurrentStageIdPath'
        - $ref: '#/components/parameters/NextStageIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamDistributionRequest'
            example:
              strategy: "SNAKE_DRAFT"
              preserveTopPerformers: true
              balanceByPoints: true
      responses:
        '200':
          description: Teams progressed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
