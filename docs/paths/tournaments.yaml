  /uploads/matches/{id}/screenshots/upload:
    post:
      tags: [Tournament Uploads]
      summary: Upload match screenshots
      description: |
        Multipart upload for tournament match screenshots (not Quick PT).

        **Required query param:** `type=ATTENDANCE_IMAGE` or `type=RESULT_IMAGE`
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchIdPath'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScreenshotType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshots]
              properties:
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
                  maxItems: 10
      responses:
        '201':
          description: Screenshots uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Screenshots uploaded successfully"
                  data:
                    type: object
                    properties:
                      screenshots:
                        type: array
                        items:
                          type: object
                      uploadId:
                        type: string
                        format: uuid
                      count:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/MetaObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

