# ══════════════════════════════════════════════════════════════════════════════
# TOURNAMENT MODULE — docs/paths/tournaments.yaml
#
# Full BGMI tournament lifecycle APIs (excludes Quick PT).
# Auto-loaded by docsloader.ts alongside docs/swagger.yaml.
#
# Base URL: /api/v1  (see servers in docs/swagger.yaml)
# Auth: JWT Bearer on every endpoint below.
#
# Integration flow:
#   1. POST /tournaments/create
#   2. POST /tournament-stages/tournaments/{tournamentId}/stages
#   3. POST /groups/tournaments/{tournamentId}/groups/create
#   4. POST /team-registrations/tournaments/{tournamentId}/registrations/create
#   5. POST /slot-management/groups/{groupId}/slots/assign
#   6. POST /matches/tournaments/{tournamentId}/matches/create
#   7. POST /uploads/matches/{id}/screenshots/upload?type=RESULT_IMAGE
#   8. POST /match-results/matches/{matchId}/results
#   9. GET  /leaderboards/tournament/{tournamentId}
# ══════════════════════════════════════════════════════════════════════════════

components:

  schemas:

    # ── Shared envelope helpers ───────────────────────────────────────────────

    TournamentSuccessEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          description: Endpoint-specific payload
        meta:
          $ref: '#/components/schemas/MetaObject'

    # ── Core tournament ───────────────────────────────────────────────────────

    TournamentStatus:
      type: string
      enum: [UPCOMING, ONGOING, COMPLETED]
      example: UPCOMING

    TournamentType:
      type: string
      enum: [TOURNAMENT]
      example: TOURNAMENT

    TournamentFormat:
      type: string
      enum: [ELIMINATION, ROUND_ROBIN, MIXED]
      example: ELIMINATION

    TournamentObject:
      type: object
      description: |
        Tournament record. New tournaments are written to Redis first (`dbStatus: PENDING_SYNC`)
        and synced to PostgreSQL asynchronously.
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          example: "BGMI Pro League S1"
        game:
          type: string
          example: "BGMI"
        tournamentType:
          $ref: '#/components/schemas/TournamentType'
        status:
          $ref: '#/components/schemas/TournamentStatus'
        userId:
          type: string
          format: uuid
          example: "456e7890-e12c-34f5-b678-789012345678"
        maxTeams:
          type: integer
          nullable: true
          example: null
        entryFee:
          type: number
          nullable: true
          example: null
        prizePool:
          type: number
          nullable: true
          example: null
        totalStages:
          type: integer
          example: 1
          description: Present when loaded from database
        currentStage:
          type: integer
          example: 1
          description: Present when loaded from database
        tournamentFormat:
          $ref: '#/components/schemas/TournamentFormat'
        maxTeamsPerGroup:
          type: integer
          example: 25
          description: Present when loaded from database
        allowCollaborators:
          type: boolean
          example: false
          description: Present when loaded from database
        registrationFields:
          type: array
          nullable: true
          items:
            type: object
          description: Custom registration field config (JSON, DB only)
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED]
          example: PENDING_SYNC
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        matches:
          type: array
          description: Included on GET /tournaments/get/{id} when loaded from DB
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              matchNumber:
                type: integer
              status:
                type: string
              createdAt:
                type: string
                format: date-time
        _count:
          type: object
          properties:
            matches:
              type: integer

    CreateTournamentRequest:
      type: object
      required: [name, game]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-zA-Z0-9\s\-_]+$'
          example: "BGMI Pro League S1"
        game:
          type: string
          minLength: 2
          maxLength: 50
          example: "BGMI"
        tournamentType:
          $ref: '#/components/schemas/TournamentType'
        maxTeams:
          type: integer
          minimum: 1
          maximum: 1000
          example: 64
          description: Validated but not persisted by controller (only name, game, status are saved today)
        entryFee:
          type: number
          exclusiveMinimum: 0
          example: 100
          description: Validated but not persisted by controller
        prizePool:
          type: number
          exclusiveMinimum: 0
          example: 50000
          description: Validated but not persisted by controller
        status:
          $ref: '#/components/schemas/TournamentStatus'

    UpdateTournamentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "BGMI Pro League S1 — Finals"
        game:
          type: string
          minLength: 2
          maxLength: 50
          example: "BGMI"
        status:
          $ref: '#/components/schemas/TournamentStatus'

    TournamentListData:
      type: object
      properties:
        tournaments:
          type: array
          items:
            $ref: '#/components/schemas/TournamentObject'
        count:
          type: integer
          example: 3

    # ── Stages ────────────────────────────────────────────────────────────────

    StageFormat:
      type: string
      enum: [ELIMINATION, ROUND_ROBIN]
      example: ELIMINATION

    TournamentStageObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "223e4567-e89b-12d3-a456-426614174001"
        name:
          type: string
          example: "Quarter Finals"
        stageNumber:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        totalGroups:
          type: integer
          example: 4
        qualificationSpots:
          type: integer
          example: 8
        stageFormat:
          $ref: '#/components/schemas/StageFormat'
        isActive:
          type: boolean
          example: true
        isCompleted:
          type: boolean
          example: false
        tournamentId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED]

    CreateStageRequest:
      type: object
      required: [name, stageNumber]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Quarter Finals"
        stageNumber:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        totalGroups:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
          example: 4
        qualificationSpots:
          type: integer
          minimum: 1
          maximum: 100
          default: 8
          example: 8
        stageFormat:
          $ref: '#/components/schemas/StageFormat'

    UpdateStageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        totalGroups:
          type: integer
          minimum: 1
          maximum: 50
        qualificationSpots:
          type: integer
          minimum: 1
          maximum: 100
        stageFormat:
          $ref: '#/components/schemas/StageFormat'
        isActive:
          type: boolean
        isCompleted:
          type: boolean

    StageAdvanceData:
      type: object
      properties:
        completedStage:
          $ref: '#/components/schemas/TournamentStageObject'
        nextStage:
          allOf:
            - $ref: '#/components/schemas/TournamentStageObject'
          nullable: true
        tournamentCompleted:
          type: boolean
          example: false

    # ── Groups ────────────────────────────────────────────────────────────────

    GroupObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "323e4567-e89b-12d3-a456-426614174002"
        name:
          type: string
          example: "Group A"
        maxTeams:
          type: integer
          example: 24
        qualificationSpots:
          type: integer
          example: 8
        matchCount:
          type: integer
          example: 1
          description: Present when loaded from database
        maxSlots:
          type: integer
          example: 25
          description: Present when loaded from database
        tournamentId:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED]

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z0-9\s\-_]+$'
          example: "Group A"
        maxTeams:
          type: integer
          minimum: 1
          maximum: 100
          example: 24
        qualificationSpots:
          type: integer
          minimum: 1
          maximum: 50
          example: 8

    UpdateGroupRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z0-9\s\-_]+$'
        maxTeams:
          type: integer
          minimum: 1
          maximum: 100
        qualificationSpots:
          type: integer
          minimum: 1
          maximum: 50

    # ── Team registrations ────────────────────────────────────────────────────

    RegistrationStatus:
      type: string
      enum: [PENDING, CONFIRMED, QUALIFIED, ELIMINATED]
      example: PENDING

    TeamRegistrationObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "423e4567-e89b-12d3-a456-426614174003"
        teamName:
          type: string
          example: "Team Phoenix"
        contactInfo:
          type: string
          example: "captain@teamphoenix.com"
        registrationStatus:
          $ref: '#/components/schemas/RegistrationStatus'
        finalPosition:
          type: integer
          nullable: true
          example: null
        totalPoints:
          type: integer
          example: 0
        tournamentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
          nullable: true
        currentStage:
          type: integer
          example: 1
        playerDetails:
          type: object
          nullable: true
        slotNumber:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED]

    CreateTeamRegistrationRequest:
      type: object
      required: [teamName, contactInfo]
      properties:
        teamName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z0-9\s\-_]+$'
          example: "Team Phoenix"
        contactInfo:
          type: string
          minLength: 5
          maxLength: 100
          example: "captain@teamphoenix.com"
        groupId:
          type: string
          format: uuid
          description: Optional — assign team to a group at registration time

    UpdateTeamRegistrationRequest:
      type: object
      minProperties: 1
      properties:
        teamName:
          type: string
          minLength: 2
          maxLength: 50
          pattern: '^[a-zA-Z0-9\s\-_]+$'
        contactInfo:
          type: string
          minLength: 5
          maxLength: 100
        registrationStatus:
          $ref: '#/components/schemas/RegistrationStatus'
        finalPosition:
          type: integer
          minimum: 1
        totalPoints:
          type: integer
          minimum: 0
        groupId:
          type: string
          format: uuid

    # ── Matches ───────────────────────────────────────────────────────────────

    MatchStatus:
      type: string
      enum: [PENDING_PROCESSING, PROCESSED, ERROR]
      example: PENDING_PROCESSING

    ResultStatus:
      type: string
      enum: [PENDING, PROCESSED, VERIFIED, MANUAL_ENTRY]
      example: PENDING

    MatchObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "523e4567-e89b-12d3-a456-426614174004"
        matchNumber:
          type: integer
          minimum: 1
          maximum: 100
          example: 1
        matchDate:
          type: string
          format: date-time
          example: "2024-12-25T10:00:00.000Z"
        status:
          $ref: '#/components/schemas/MatchStatus'
        resultStatus:
          $ref: '#/components/schemas/ResultStatus'
        tournamentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
          nullable: true
        stageNumber:
          type: integer
          nullable: true
        processedData:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dbStatus:
          type: string
          enum: [PENDING_SYNC, SYNCED]

    CreateMatchRequest:
      type: object
      required: [matchNumber]
      properties:
        matchNumber:
          type: integer
          minimum: 1
          maximum: 100
          example: 1
        matchDate:
          type: string
          format: date-time
          example: "2024-12-25T10:00:00.000Z"
        groupId:
          type: string
          format: uuid
          description: Validated but not passed to service by controller today

    UpdateMatchRequest:
      type: object
      minProperties: 1
      properties:
        matchNumber:
          type: integer
          minimum: 1
          maximum: 100
        matchDate:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MatchStatus'
        processedData:
          type: object

    # ── Match results ─────────────────────────────────────────────────────────

    TeamResultInput:
      type: object
      required: [teamId, kills, placement]
      properties:
        teamId:
          type: string
          format: uuid
          description: Team registration ID
          example: "423e4567-e89b-12d3-a456-426614174003"
        kills:
          type: integer
          minimum: 0
          maximum: 100
          example: 12
        placement:
          type: integer
          minimum: 1
          maximum: 100
          example: 3
        damage:
          type: number
          minimum: 0
        survivalTime:
          type: number
          minimum: 0

    CreateMatchResultRequest:
      type: object
      required: [teamResults]
      properties:
        screenshotUrl:
          type: string
          format: uri
        teamResults:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TeamResultInput'
        notes:
          type: string
          maxLength: 1000

    UpdateMatchResultRequest:
      type: object
      minProperties: 1
      properties:
        screenshotUrl:
          type: string
          format: uri
        teamResults:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TeamResultInput'
        notes:
          type: string
          maxLength: 1000
        status:
          $ref: '#/components/schemas/ResultStatus'

    VerifyResultsRequest:
      type: object
      required: [verificationStatus]
      properties:
        verificationStatus:
          $ref: '#/components/schemas/ResultStatus'
        verificationNotes:
          type: string
          maxLength: 500

    PublishResultsRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          enum: [true]
          example: true

    CalculateScoresRequest:
      type: object
      properties:
        scoringRuleId:
          type: string
          format: uuid
          description: Zod-validated field; controller currently reads `teamResults` instead (see endpoint note)

    MatchResultObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        teamRegistrationId:
          type: string
          format: uuid
        slotNumber:
          type: integer
        position:
          type: integer
        totalKills:
          type: integer
        killPoints:
          type: integer
        positionPoints:
          type: integer
        totalMatchPoints:
          type: integer
        playerResults:
          type: object
        verifiedBy:
          type: string
          format: uuid
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Leaderboards ──────────────────────────────────────────────────────────

    LeaderboardEntry:
      type: object
      required: [teamRegistrationId, teamName, totalMatches, totalKills, totalPoints, rank]
      properties:
        teamRegistrationId:
          type: string
          example: "423e4567-e89b-12d3-a456-426614174003"
        teamName:
          type: string
          example: "Team Phoenix"
        totalMatches:
          type: integer
          example: 6
        totalKills:
          type: integer
          example: 42
        totalPoints:
          type: integer
          example: 87
        averageKills:
          type: number
          format: float
          example: 7.0
        averagePosition:
          type: number
          format: float
          example: 5.5
        bestPosition:
          type: integer
          example: 1
        wins:
          type: integer
          example: 2
        top5Finishes:
          type: integer
          example: 4
        top10Finishes:
          type: integer
          example: 5
        winRate:
          type: number
          format: float
          example: 33.3
        rank:
          type: integer
          example: 1
        previousRank:
          type: integer
          example: 2
        rankChange:
          type: string
          enum: [UP, DOWN, SAME]
          example: UP
        lastUpdated:
          type: string
          format: date-time

    TournamentLeaderboard:
      type: object
      required: [tournamentId, tournamentName, totalTeams, totalMatches, entries, generatedAt]
      properties:
        tournamentId:
          type: string
        tournamentName:
          type: string
          example: "BGMI Pro League S1"
        totalTeams:
          type: integer
          example: 16
        totalMatches:
          type: integer
          example: 6
        lastUpdated:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        generatedAt:
          type: string
          format: date-time

    GroupLeaderboard:
      type: object
      required: [groupId, groupName, tournamentId, totalTeams, totalMatches, entries, generatedAt]
      properties:
        groupId:
          type: string
        groupName:
          type: string
          example: "Group A"
        tournamentId:
          type: string
        totalTeams:
          type: integer
        totalMatches:
          type: integer
        lastUpdated:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        generatedAt:
          type: string
          format: date-time

    LeaderboardSearchRequest:
      type: object
      description: At least one of tournamentId or groupId is required by the service
      properties:
        tournamentId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        teamName:
          type: string
        minKills:
          type: integer
        maxKills:
          type: integer
        minPosition:
          type: integer
        maxPosition:
          type: integer
        rankRange:
          type: object
          properties:
            from:
              type: integer
            to:
              type: integer

    RefreshLeaderboardRequest:
      type: object
      properties:
        forceRefresh:
          type: boolean
          default: true
        includeGroups:
          type: boolean
        notifyTeams:
          type: boolean
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        stageId:
          type: string
          format: uuid

    # ── Team advancement ──────────────────────────────────────────────────────

    DistributionStrategy:
      type: string
      enum: [RANDOM, BALANCED, SNAKE_DRAFT, SEEDED]
      example: SNAKE_DRAFT

    TeamDistributionRequest:
      type: object
      required: [strategy]
      properties:
        strategy:
          $ref: '#/components/schemas/DistributionStrategy'
        preserveTopPerformers:
          type: boolean
          example: true
        balanceByPoints:
          type: boolean
          example: true

    CreateStageGroupsRequest:
      type: object
      required: [groupsData]
      properties:
        groupsData:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 50
                example: "Group A"
              maxTeams:
                type: integer
                minimum: 2
                maximum: 50
                default: 24
              qualificationSpots:
                type: integer
                minimum: 1
                default: 8

    QualifiedTeamObject:
      type: object
      required: [teamRegistrationId, teamName, finalGroupPosition, totalPoints, totalKills, fromGroupId, fromGroupName, qualificationReason]
      properties:
        teamRegistrationId:
          type: string
          format: uuid
          example: "423e4567-e89b-12d3-a456-426614174003"
        teamName:
          type: string
          example: "Team Phoenix"
        finalGroupPosition:
          type: integer
          example: 1
        totalPoints:
          type: integer
          example: 87
        totalKills:
          type: integer
          example: 42
        fromGroupId:
          type: string
          format: uuid
          example: "323e4567-e89b-12d3-a456-426614174002"
        fromGroupName:
          type: string
          example: "Group A"
        qualificationReason:
          type: string
          example: "Qualified as #1 (Top 4)"

    EliminatedTeamObject:
      type: object
      required: [teamRegistrationId, teamName, finalGroupPosition, totalPoints, eliminationReason]
      properties:
        teamRegistrationId:
          type: string
          format: uuid
        teamName:
          type: string
          example: "Team Delta"
        finalGroupPosition:
          type: integer
          example: 5
        totalPoints:
          type: integer
          example: 34
        eliminationReason:
          type: string
          example: "Eliminated at #5 (Only top 4 qualify)"

    GroupQualificationResultObject:
      type: object
      required: [groupId, groupName, totalTeams, qualificationSpots, qualifiedTeams, eliminatedTeams]
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
          example: "Group A"
        totalTeams:
          type: integer
          example: 8
        qualificationSpots:
          type: integer
          example: 4
        qualifiedTeams:
          type: array
          items:
            $ref: '#/components/schemas/QualifiedTeamObject'
        eliminatedTeams:
          type: array
          items:
            $ref: '#/components/schemas/EliminatedTeamObject'

    StageQualificationResultObject:
      type: object
      description: Returned by POST qualify and GET qualification-results (cached in Redis)
      required: [stageId, stageName, totalGroups, totalTeamsStarted, totalTeamsQualified, groupResults, qualificationSummary]
      properties:
        stageId:
          type: string
          format: uuid
        stageName:
          type: string
          example: "Quarter Finals"
        totalGroups:
          type: integer
          example: 2
        totalTeamsStarted:
          type: integer
          example: 16
        totalTeamsQualified:
          type: integer
          example: 8
        groupResults:
          type: array
          items:
            $ref: '#/components/schemas/GroupQualificationResultObject'
        qualificationSummary:
          type: object
          required: [teamsAdvanced, teamsEliminated, averagePointsToQualify]
          properties:
            teamsAdvanced:
              type: integer
              example: 8
            teamsEliminated:
              type: integer
              example: 8
            averagePointsToQualify:
              type: integer
              example: 72

    GroupTeamAssignmentObject:
      type: object
      required: [groupId, groupName, assignedTeams, managementSlots, totalSlots, filledSlots]
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
          example: "Group A"
        assignedTeams:
          type: array
          items:
            $ref: '#/components/schemas/QualifiedTeamObject'
        managementSlots:
          type: integer
          example: 2
          description: Reserved management slots per group (default 2 in service)
        totalSlots:
          type: integer
          example: 24
        filledSlots:
          type: integer
          example: 4

    StageProgressionResultObject:
      type: object
      description: Returned by POST progress and GET progression-results (cached in Redis)
      required: [fromStage, toStage, teamDistribution, progressionSummary]
      properties:
        fromStage:
          type: object
          required: [stageId, stageName, totalTeamsQualified]
          properties:
            stageId:
              type: string
              format: uuid
            stageName:
              type: string
              example: "Quarter Finals"
            totalTeamsQualified:
              type: integer
              example: 8
        toStage:
          type: object
          required: [stageId, stageName, totalGroups, maxTeamsPerGroup]
          properties:
            stageId:
              type: string
              format: uuid
            stageName:
              type: string
              example: "Semi Finals"
            totalGroups:
              type: integer
              example: 2
            maxTeamsPerGroup:
              type: integer
              example: 24
        teamDistribution:
          type: array
          items:
            $ref: '#/components/schemas/GroupTeamAssignmentObject'
        progressionSummary:
          type: object
          required: [teamsAdvanced, newGroupsPopulated, averageTeamsPerGroup, managementSlotsReserved]
          properties:
            teamsAdvanced:
              type: integer
              example: 8
            newGroupsPopulated:
              type: integer
              example: 2
            averageTeamsPerGroup:
              type: integer
              example: 4
            managementSlotsReserved:
              type: integer
              example: 4

    StageGroupsResultObject:
      type: object
      description: Returned by POST /team-advancement/stage/{stageId}/groups
      required: [stageId, stageName, totalGroups, createdGroups]
      properties:
        stageId:
          type: string
          format: uuid
        stageName:
          type: string
          example: "Semi Finals"
        totalGroups:
          type: integer
          example: 2
        createdGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupObject'

    StageGroupsListData:
      type: object
      description: Returned by GET /team-advancement/stage/{stageId}/groups
      required: [stageId, totalGroups, groups]
      properties:
        stageId:
          type: string
          format: uuid
        totalGroups:
          type: integer
          example: 2
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupObject'

    StageAdvancementResultObject:
      type: object
      description: Stage transition result from advanceStage (used inside complete-progression)
      required: [completedStage, nextStage, tournamentCompleted]
      properties:
        completedStage:
          $ref: '#/components/schemas/TournamentStageObject'
        nextStage:
          allOf:
            - $ref: '#/components/schemas/TournamentStageObject'
          nullable: true
        tournamentCompleted:
          type: boolean
          example: false

    SlotAssignmentBatchResultObject:
      type: object
      description: Auto slot assignment summary from completeStageProgression
      required: [totalSlotsAssigned, groupResults]
      properties:
        totalSlotsAssigned:
          type: integer
          example: 8
        groupResults:
          type: array
          items:
            type: object
            required: [groupId, groupName, teamsAssigned, slotsUsed]
            properties:
              groupId:
                type: string
                format: uuid
              groupName:
                type: string
                example: "Group A"
              teamsAssigned:
                type: integer
                example: 4
              slotsUsed:
                type: integer
                example: 4

    CompleteStageProgressionData:
      type: object
      description: Returned by POST complete-progression
      required: [qualificationResult, progressionResult, slotAssignmentResults, stageAdvancementResult, summary]
      properties:
        qualificationResult:
          $ref: '#/components/schemas/StageQualificationResultObject'
        progressionResult:
          $ref: '#/components/schemas/StageProgressionResultObject'
        slotAssignmentResults:
          $ref: '#/components/schemas/SlotAssignmentBatchResultObject'
        stageAdvancementResult:
          $ref: '#/components/schemas/StageAdvancementResultObject'
        summary:
          type: object
          required: [teamsQualified, teamsEliminated, newGroupsPopulated, slotsAssigned, nextStageActivated]
          properties:
            teamsQualified:
              type: integer
              example: 8
            teamsEliminated:
              type: integer
              example: 8
            newGroupsPopulated:
              type: integer
              example: 2
            slotsAssigned:
              type: integer
              example: 8
            nextStageActivated:
              type: boolean
              example: true

    TournamentStageProgressItem:
      type: object
      required: [stage, groups, qualification, progression]
      properties:
        stage:
          type: object
          required: [id, name, stageNumber, isActive, isCompleted, totalGroups]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: "Quarter Finals"
            stageNumber:
              type: integer
              example: 1
            isActive:
              type: boolean
              example: false
            isCompleted:
              type: boolean
              example: true
            totalGroups:
              type: integer
              example: 2
        groups:
          type: integer
          example: 2
          description: Count of groups in this stage (not the group objects themselves)
        qualification:
          type: object
          nullable: true
          properties:
            teamsQualified:
              type: integer
              example: 8
            teamsEliminated:
              type: integer
              example: 8
            averagePointsToQualify:
              type: integer
              example: 72
        progression:
          type: object
          nullable: true
          properties:
            teamsAdvanced:
              type: integer
              example: 8
            newGroupsPopulated:
              type: integer
              example: 2

    TournamentProgressData:
      type: object
      description: Returned by GET /team-advancement/tournament/{tournamentId}/progress
      required: [tournamentId, totalStages, completedStages, currentStage, overallProgress, stageProgress]
      properties:
        tournamentId:
          type: string
          format: uuid
        totalStages:
          type: integer
          example: 3
        completedStages:
          type: integer
          example: 1
        currentStage:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: "Semi Finals"
            stageNumber:
              type: integer
              example: 2
        overallProgress:
          type: integer
          example: 33
          description: Percentage rounded — (completedStages / totalStages) * 100
        stageProgress:
          type: array
          items:
            $ref: '#/components/schemas/TournamentStageProgressItem'

    # ── Slot management ───────────────────────────────────────────────────────

    SlotType:
      type: string
      enum: [TEAM_SLOT, MANAGEMENT_SLOT, RESERVED_SLOT]
      example: TEAM_SLOT

    AssignSlotRequest:
      type: object
      required: [slotNumber, teamRegistrationId]
      properties:
        slotNumber:
          type: integer
          minimum: 1
          maximum: 25
          example: 5
        teamRegistrationId:
          type: string
          format: uuid
        slotType:
          $ref: '#/components/schemas/SlotType'
          description: Documented in route swagger; controller reads only slotNumber and teamRegistrationId

    AutoAssignSlotsRequest:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [RANDOM, BALANCED, SKILL_BASED, MANUAL_ORDER]
          example: BALANCED
        excludeSlots:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 25
          example: [1, 25]
        teamPriorities:
          type: array
          items:
            type: object
            properties:
              teamRegistrationId:
                type: string
                format: uuid
              priority:
                type: integer

    SwapSlotsRequest:
      type: object
      required: [slot1, slot2]
      properties:
        slot1:
          type: integer
          minimum: 1
          maximum: 25
          example: 5
        slot2:
          type: integer
          minimum: 1
          maximum: 25
          example: 10
        reason:
          type: string
          maxLength: 200

    SlotAssignmentObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slotNumber:
          type: integer
        groupId:
          type: string
          format: uuid
        teamRegistrationId:
          type: string
          format: uuid
          nullable: true
        slotType:
          $ref: '#/components/schemas/SlotType'
        isActive:
          type: boolean
        assignedAt:
          type: string
          format: date-time
        assignedBy:
          type: string
          format: uuid

    GroupSlotsData:
      type: object
      properties:
        groupId:
          type: string
          format: uuid
        totalSlots:
          type: integer
          example: 25
        occupiedSlots:
          type: integer
          example: 16
        availableSlots:
          type: integer
          example: 9
        slots:
          type: array
          items:
            type: object
            properties:
              slotNumber:
                type: integer
              teamRegistrationId:
                type: string
                format: uuid
                nullable: true
              teamName:
                type: string
                nullable: true
              slotType:
                $ref: '#/components/schemas/SlotType'
              isOccupied:
                type: boolean

    # ── Tournament uploads ────────────────────────────────────────────────────

    ScreenshotType:
      type: string
      enum: [ATTENDANCE_IMAGE, RESULT_IMAGE]
      example: RESULT_IMAGE

paths:

  # ════════════════════════════════════════════════════════════════════════════
  # TOURNAMENTS — /tournaments
  # ════════════════════════════════════════════════════════════════════════════

  /tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments for authenticated user
      description: |
        Returns **all** tournaments owned by the authenticated user.

        **Important:** No query parameters are processed by the controller today
        (pagination, search, and filters in legacy swagger are not implemented).

        Returns `404` when the user has zero tournaments.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tournaments retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "User tournaments fetched successfully"
                      data:
                        $ref: '#/components/schemas/TournamentListData'
              example:
                success: true
                message: "User tournaments fetched successfully"
                data:
                  tournaments:
                    - id: "123e4567-e89b-12d3-a456-426614174000"
                      name: "BGMI Pro League S1"
                      game: "BGMI"
                      tournamentType: "TOURNAMENT"
                      status: "UPCOMING"
                      userId: "456e7890-e12c-34f5-b678-789012345678"
                      maxTeams: null
                      entryFee: null
                      prizePool: null
                      dbStatus: "PENDING_SYNC"
                      createdAt: "2024-01-15T10:30:00.000Z"
                      updatedAt: "2024-01-15T10:30:00.000Z"
                  count: 1
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /tournaments/create:
    post:
      tags: [Tournaments]
      summary: Create tournament
      description: |
        Creates a tournament and associates it with the authenticated user.

        **Persisted fields today:** `name`, `game`, `status` (defaults to `UPCOMING`).
        Other validated fields (`maxTeams`, `entryFee`, `prizePool`, `tournamentType`) are accepted
        by validation but not passed through by the controller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTournamentRequest'
            examples:
              minimal:
                summary: Minimum required fields
                value:
                  name: "BGMI Weekly Scrims"
                  game: "BGMI"
              with_status:
                summary: With explicit status
                value:
                  name: "BGMI Pro League S1"
                  game: "BGMI"
                  status: "UPCOMING"
      responses:
        '201':
          description: Tournament created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament created successfully"
                      data:
                        $ref: '#/components/schemas/TournamentObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /tournaments/get/{id}:
    get:
      tags: [Tournaments]
      summary: Get tournament by ID
      description: Only the tournament owner (`userId`) can access this resource.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Tournament retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament fetched successfully"
                      data:
                        $ref: '#/components/schemas/TournamentObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /tournaments/update/{id}:
    put:
      tags: [Tournaments]
      summary: Update tournament
      description: At least one field required. Owner-only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTournamentRequest'
            example:
              name: "BGMI Pro League S1 — Week 2"
              status: "ONGOING"
      responses:
        '200':
          description: Tournament updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament updated successfully"
                      data:
                        $ref: '#/components/schemas/TournamentObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /tournaments/delete/{id}:
    delete:
      tags: [Tournaments]
      summary: Delete tournament
      description: Soft-deletes from Redis immediately and queues DB cleanup. Owner-only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Tournament deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament deleted successfully"
                      data:
                        type: object
                        properties:
                          success:
                            type: boolean
                            example: true
                          message:
                            type: string
                            example: "Tournament deleted successfully"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  # ════════════════════════════════════════════════════════════════════════════
  # TOURNAMENT STAGES — /tournament-stages
  # ════════════════════════════════════════════════════════════════════════════

  /tournament-stages/tournaments/{tournamentId}/stages:
    post:
      tags: [Tournament Stages]
      summary: Create stage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageRequest'
            example:
              name: "Quarter Finals"
              stageNumber: 2
              totalGroups: 4
              qualificationSpots: 8
              stageFormat: "ELIMINATION"
      responses:
        '201':
          description: Stage created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Tournament stage created successfully"
                      data:
                        $ref: '#/components/schemas/TournamentStageObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Tournament Stages]
      summary: List stages for tournament
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Stages retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Stages retrieved successfully"
                      data:
                        type: object
                        properties:
                          stages:
                            type: array
                            items:
                              $ref: '#/components/schemas/TournamentStageObject'
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /tournament-stages/stages/{stageId}:
    get:
      tags: [Tournament Stages]
      summary: Get stage by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      responses:
        '200':
          description: Stage retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TournamentStageObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Tournament Stages]
      summary: Update stage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageRequest'
      responses:
        '200':
          description: Stage updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TournamentStageObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Tournament Stages]
      summary: Delete stage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      responses:
        '200':
          description: Stage deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /tournament-stages/stages/{stageId}/advance:
    post:
      tags: [Tournament Stages]
      summary: Advance tournament to next stage
      description: Marks current stage complete and activates the next stage when available.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StageIdPath'
      responses:
        '200':
          description: Stage advanced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StageAdvanceData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ════════════════════════════════════════════════════════════════════════════
  # GROUPS — /groups
  # ════════════════════════════════════════════════════════════════════════════

  /groups/tournaments/{tournamentId}/groups:
    get:
      tags: [Groups]
      summary: List groups in tournament
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Groups retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupObject'
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/tournaments/{tournamentId}/groups/create:
    post:
      tags: [Groups]
      summary: Create group
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            example:
              name: "Group A"
              maxTeams: 24
              qualificationSpots: 8
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/get/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      description: |
        **Known issue:** Route param is `id` but Zod schema expects `groupId`.
        Requests may fail validation until the schema is aligned with the route.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      responses:
        '200':
          description: Group retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/update/{id}:
    put:
      tags: [Groups]
      summary: Update group
      description: See `/groups/get/{id}` for param validation note.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/delete/{id}:
    delete:
      tags: [Groups]
      summary: Delete group
      description: See `/groups/get/{id}` for param validation note.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentSuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ════════════════════════════════════════════════════════════════════════════
  # TEAM REGISTRATIONS — /team-registrations
  # ════════════════════════════════════════════════════════════════════════════

  /team-registrations/tournaments/{tournamentId}/registrations:
    get:
      tags: [Team Registrations]
      summary: List team registrations for tournament
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Registrations retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
