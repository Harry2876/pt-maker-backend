  # ════════════════════════════════════════════════════════════════════════════
  # GROUPS — /groups
  #
  # STAGE LINKING QUICK REFERENCE
  # ─────────────────────────────
  # Create + link:  POST /groups/tournaments/{tournamentId}/groups/create
  #                   body.stageId optional (see CreateGroupRequest)
  # Bulk next stage: POST /team-advancement/stage/{stageId}/groups
  # List by stage:    GET  /team-advancement/stage/{stageId}/groups
  # Update group:     PUT  /groups/update/{id}  (name/maxTeams/qualSpots — NO stageId)
  # ════════════════════════════════════════════════════════════════════════════

  /groups/tournaments/{tournamentId}/groups:
    get:
      tags: [Groups]
      summary: List groups in tournament
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      responses:
        '200':
          description: Groups retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroupObject'
                          count:
                            type: integer
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/tournaments/{tournamentId}/groups/create:
    post:
      tags: [Groups]
      summary: Create group
      description: |
        **Primary way to create a group and link it to a stage.**

        | Step | Action |
        |------|--------|
        | 1 | Create stage first → `POST /tournament-stages/tournaments/{tournamentId}/stages` |
        | 2 | Call this endpoint with `stageId` in body (or omit if single/active stage) |
        | 3 | Save `data.id` (groupId) and `data.stageId` from the 201 response |

        ```json
        POST /groups/tournaments/{tournamentId}/groups/create
        { "name": "Group A", "maxTeams": 16, "qualificationSpots": 8,
          "stageId": "223e4567-e89b-12d3-a456-426614174001" }
        ```
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TournamentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            examples:
              auto_stage:
                summary: Single/active stage (omit stageId)
                value:
                  name: "Group A"
                  maxTeams: 24
                  qualificationSpots: 8
              explicit_stage:
                summary: Multi-stage (pass stageId)
                value:
                  name: "Group A"
                  maxTeams: 24
                  qualificationSpots: 8
                  stageId: "223e4567-e89b-12d3-a456-426614174001"
      responses:
        '201':
          description: Group created and linked to stage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Group created successfully"
                      data:
                        $ref: '#/components/schemas/GroupObject'
              example:
                success: true
                message: "Group created successfully"
                data:
                  id: "323e4567-e89b-12d3-a456-426614174002"
                  name: "Group A"
                  maxTeams: 16
                  qualificationSpots: 8
                  tournamentId: "123e4567-e89b-12d3-a456-426614174000"
                  stageId: "223e4567-e89b-12d3-a456-426614174001"
                  dbStatus: "PENDING_SYNC"
                  createdAt: "2024-01-15T10:30:00.000Z"
                  updatedAt: "2024-01-15T10:30:00.000Z"
                meta:
                  timestamp: "2024-01-15T10:30:00.000Z"
                  version: "1.0"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/get/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdPathAsId'
      responses:
        '200':
          description: Group retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
