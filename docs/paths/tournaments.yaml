  # MATCH RESULTS — /match-results
  # ════════════════════════════════════════════════════════════════════════════

  /match-results/matches/{matchId}/results:
    post:
      tags: [Match Results]
      summary: Submit match results
      description: |
        Creates **one match result record** containing all teams in `teamResults[]`.
        This is not an array of per-team DB rows — one POST → one `MatchResultObject`
        with multiple entries in `teamResults`.

        Request uses `teamId` + `placement`; response uses `teamRegistrationId` + `position`
        with calculated `totalScore` / `scoreBreakdown`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MatchIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchResultRequest'
            example:
              teamResults:
                - teamId: "423e4567-e89b-12d3-a456-426614174003"
                  kills: 12
                  placement: 1
                - teamId: "523e4567-e89b-12d3-a456-426614174005"
                  kills: 8
                  placement: 2
              notes: "Manual entry from organizer"
      responses:
        '201':
          description: Results created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TournamentSuccessEnvelope'
                  - type: object
                    properties:
                      message:
                        example: "Match result created successfully"
                      data:
                        $ref: '#/components/schemas/MatchResultObject'
              example:
                success: true
                message: "Match result created successfully"
                data:
